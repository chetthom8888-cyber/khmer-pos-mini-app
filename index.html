<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហាងលក់ទំនិញខេមរៈ (Khmer Mini POS)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Html5-Qrcode for Camera Scanning -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Kantumruy Pro', 'Battambang', sans-serif;
            background-color: #f3f4f6;
            -webkit-user-select: text;
            user-select: text;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding-bottom: 90px;
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="app-container flex flex-col justify-between">
        
        <!-- Header -->
        <header class="bg-emerald-700 text-white p-4 sticky top-0 z-40 shadow-md">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="bg-white text-emerald-700 font-bold px-2 py-1 rounded text-sm">POS</div>
                    <div>
                        <h1 id="headerStoreName" class="font-bold text-lg leading-tight">ហាងលក់ទំនិញខេមរៈ</h1>
                        <p class="text-xs text-emerald-200 flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-green-400 inline-block"></span> តភ្ជាប់ Telegram ជោគជ័យ
                        </p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="switchTab('settings')" class="p-1.5 hover:bg-emerald-600 rounded-full">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Viewport -->
        <main id="mainContent" class="p-4 flex-1 overflow-y-auto">
            <!-- Dynamic Content -->
        </main>

        <!-- Fixed Bottom Navigation (6 Buttons) -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t border-gray-200 z-50 shadow-lg">
            <div class="grid grid-cols-6 py-2 text-center text-xs">
                <button onclick="switchTab('products')" id="nav-products" class="flex flex-col items-center justify-center text-emerald-600 font-bold">
                    <i data-lucide="box" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ទំនិញ</span>
                </button>
                <button onclick="switchTab('customers')" id="nav-customers" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600">
                    <i data-lucide="users" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">អតិថិជន</span>
                </button>
                <button onclick="switchTab('invoices')" id="nav-invoices" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600">
                    <i data-lucide="receipt" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">វិក្កយបត្រ</span>
                </button>
                <button onclick="switchTab('finance')" id="nav-finance" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600">
                    <i data-lucide="wallet" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ចំណូលចំណាយ</span>
                </button>
                <button onclick="switchTab('stock')" id="nav-stock" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600">
                    <i data-lucide="layers" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ស្តុកទំនិញ</span>
                </button>
                <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600">
                    <i data-lucide="settings" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ការកំណត់</span>
                </button>
            </div>
            <div class="bg-gray-50 text-center py-1 text-[10px] text-gray-400 border-t border-gray-100 select-all">
                @KhmerPosAppBot
            </div>
        </nav>

    </div>

    <!-- Modals Container -->
    <div id="modalContainer"></div>

    <!-- Application Script -->
    <script>
        let appData = JSON.parse(localStorage.getItem('khmer_pos_data_v5')) || {
            store: { 
                name: "ហាងលក់ទំនិញខេមរៈ", 
                phone: "089 355 566", 
                address: "ផ្ទះលេខ ១២៣, ភ្នំពេញ", 
                prefix: "INV",
                about: "ប្រព័ន្ធគ្រប់គ្រងការលក់ និងស្តុកទំនិញដ៏មានឥទ្ធិពល និងងាយស្រួលបំផុតសម្រាប់អាជីវកម្មខ្នាតតូច និងមធ្យមនៅកម្ពុជា។"
            },
            products: [
                { id: 1, name: "កូកាកូឡា (Coca Cola)", category: "ភេសជ្ជៈ", brand: "CocaCola", cost: 0.50, price: 0.75, qty: 120, code: "PRD-001", desc: "កំប៉ុង" },
                { id: 2, name: "កាហ្វេទឹកដោះគោ", category: "ភេសជ្ជៈ", brand: "Cafe", cost: 1.00, price: 1.50, qty: 50, code: "PRD-002", desc: "ដប" }
            ],
            categories: ["ទាំងអស់", "ភេសជ្ជៈ", "ចំណីអាហារ", "សម្ភារប្រើប្រាស់"],
            customers: [
                { id: 1, name: "លោក សុខ ជា", phone: "011 222 333", address: "តាខ្មៅ", note: "" }
            ],
            invoices: [],
            finances: [],
            isPremium: false,
            // កំណត់ថាអ្នកប្រើបច្ចុប្បន្នជា Admin ឬអត់ (អាចប្តូរជា true ឬពិនិត្យតាម Telegram username)
            isAdmin: true 
        };

        function saveData() {
            localStorage.setItem('khmer_pos_data_v5', JSON.stringify(appData));
            document.getElementById('headerStoreName').innerText = appData.store.name;
        }

        let currentTab = 'products';
        let activeCategory = 'ទាំងអស់';
        let invoiceCart = [];
        let invoiceCurrency = '$';

        function switchTab(tab) {
            currentTab = tab;
            ['products', 'customers', 'invoices', 'finance', 'stock', 'settings'].forEach(t => {
                let btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    btn.className = t === tab 
                        ? "flex flex-col items-center justify-center text-emerald-600 font-bold" 
                        : "flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600";
                }
            });
            renderContent();
        }

        function renderContent() {
            let main = document.getElementById('mainContent');
            if (currentTab === 'products') renderProductsTab(main);
            else if (currentTab === 'customers') renderCustomersTab(main);
            else if (currentTab === 'invoices') renderInvoicesTab(main);
            else if (currentTab === 'finance') renderFinanceTab(main);
            else if (currentTab === 'stock') renderStockTab(main);
            else if (currentTab === 'settings') renderSettingsTab(main);
            lucide.createIcons();
        }

        // --- 1. PRODUCTS TAB ---
        function renderProductsTab(container) {
            container.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base font-bold text-gray-800">គ្រប់គ្រងទំនិញ</h2>
                    <button onclick="openProductModal()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1 shadow">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> បញ្ចូលទំនិញ
                    </button>
                </div>
                <div class="flex gap-2 mb-3">
                    <div class="relative flex-1">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-gray-400"></i>
                        <input type="text" id="productSearch" oninput="filterProducts()" placeholder="ស្វែងរកឈ្មោះ ឬ លេខកូដ..." class="w-full pl-9 pr-3 py-2 border rounded-lg text-xs focus:outline-none focus:border-emerald-500 bg-white">
                    </div>
                    <button onclick="openBarcodeScanner('product')" class="bg-gray-800 text-white px-3 py-2 rounded-lg text-xs flex items-center gap-1 shadow">
                        <i data-lucide="camera" class="w-4 h-4"></i> ស្កេន
                    </button>
                </div>
                <div class="mb-3">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[11px] font-bold text-gray-500">ប្រភេទទំនិញ:</span>
                        <div class="flex gap-2">
                            <button onclick="addCategoryPrompt()" class="text-[11px] text-emerald-600 font-bold flex items-center gap-0.5"><i data-lucide="plus" class="w-3 h-3"></i> បន្ថែម</button>
                            <button onclick="manageCategoriesModal()" class="text-[11px] text-gray-600 font-bold flex items-center gap-0.5"><i data-lucide="settings" class="w-3 h-3"></i> កែប្រែ/លុប</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
                        ${appData.categories.map(cat => `
                            <button onclick="setCategory('${cat}')" class="px-2.5 py-1 rounded-full text-xs shrink-0 ${activeCategory === cat ? 'bg-emerald-600 text-white font-bold' : 'bg-white text-gray-600 border'}">
                                ${cat}
                            </button>
                        `).join('')}
                    </div>
                </div>
                <div id="productListContainer" class="space-y-2.5">${renderProductItems()}</div>
            `;
            lucide.createIcons();
        }

        function renderProductItems(query = '') {
            let filtered = appData.products.filter(p => {
                let matchCat = activeCategory === 'ទាំងអស់' || p.category === activeCategory;
                let matchQ = p.name.toLowerCase().includes(query.toLowerCase()) || p.code.toLowerCase().includes(query.toLowerCase());
                return matchCat && matchQ;
            });
            if (filtered.length === 0) return `<div class="text-center py-6 text-gray-400 text-xs">រកមិនឃើញទំនិញ</div>`;
            return filtered.map(p => `
                <div class="bg-white p-3 rounded-xl border shadow-sm flex justify-between items-center text-xs">
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h3 class="font-bold text-gray-800">${p.name}</h3>
                            <span class="bg-emerald-50 text-emerald-700 text-[10px] px-1.5 py-0.5 rounded">${p.category}</span>
                        </div>
                        <p class="text-gray-500 mt-0.5">កូដ: ${p.code} | ស្តុក: <span class="font-bold text-gray-700">${p.qty}</span></p>
                        <p class="text-emerald-600 font-bold mt-0.5">តម្លៃលក់: $${p.price.toFixed(2)} (ដើម: $${p.cost.toFixed(2)})</p>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="openProductModal(${p.id})" class="p-1.5 text-gray-500 hover:bg-gray-100 rounded"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button onclick="deleteProduct(${p.id})" class="p-1.5 text-red-500 hover:bg-red-50 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            let q = document.getElementById('productSearch').value;
            document.getElementById('productListContainer').innerHTML = renderProductItems(q);
            lucide.createIcons();
        }

        function setCategory(cat) { activeCategory = cat; renderContent(); }

        function addCategoryPrompt() {
            let name = prompt("បញ្ចូលឈ្មោះប្រភេទទំនិញថ្មី៖");
            if (name && name.trim()) {
                if (!appData.categories.includes(name.trim())) {
                    appData.categories.push(name.trim());
                    saveData();
                    renderContent();
                } else alert("មានរួចហើយ!");
            }
        }

        function manageCategoriesModal() {
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl w-full max-w-sm p-4 text-xs">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-sm">គ្រប់គ្រងប្រភេទទំនិញ</h3>
                            <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="space-y-2 max-h-60 overflow-y-auto mb-3">
                            ${appData.categories.filter(c => c !== 'ទាំងអស់').map(c => `
                                <div class="flex justify-between items-center bg-gray-50 p-2 rounded border">
                                    <span>${c}</span>
                                    <button onclick="deleteCategory('${c}')" class="text-red-500 hover:bg-red-100 p-1 rounded"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="closeModal(); renderContent();" class="w-full bg-emerald-600 text-white py-2 rounded font-bold">រួចរាល់</button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function deleteCategory(cat) {
            if (confirm(`តើអ្នកចង់លុបប្រភេទ "${cat}" មែនទេ?`)) {
                appData.categories = appData.categories.filter(c => c !== cat);
                if (activeCategory === cat) activeCategory = 'ទាំងអស់';
                saveData();
                manageCategoriesModal();
            }
        }

        function openProductModal(id = null) {
            let p = id ? appData.products.find(item => item.id === id) : { name: '', category: appData.categories[1] || 'ផ្សេងៗ', brand: '', cost: 0, price: 0, qty: 1, desc: '', code: 'PRD-' + Math.floor(1000 + Math.random() * 9000) };
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl w-full max-w-md p-4 text-xs max-h-[90vh] overflow-y-auto">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-sm">${id ? 'កែសម្រួលទំនិញ' : 'បញ្ចូលទំនិញថ្មី'}</h3>
                            <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="saveProduct(event, ${id})" class="space-y-2.5">
                            <div><label class="block mb-1 font-medium">ឈ្មោះទំនិញ *</label><input type="text" id="pName" value="${p.name}" required class="w-full px-2.5 py-1.5 border rounded"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block mb-1 font-medium">ប្រភេទទំនិញ</label><select id="pCat" class="w-full px-2.5 py-1.5 border bg-white rounded">${appData.categories.filter(c => c !== 'ទាំងអស់').map(c => `<option value="${c}" ${p.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
                                <div><label class="block mb-1 font-medium">ម៉ាក (Brand)</label><input type="text" id="pBrand" value="${p.brand || ''}" class="w-full px-2.5 py-1.5 border rounded"></div>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <div><label class="block mb-1 font-medium">តម្លៃដើម ($)</label><input type="number" step="0.01" id="pCost" value="${p.cost}" class="w-full px-2.5 py-1.5 border rounded"></div>
                                <div><label class="block mb-1 font-medium">តម្លៃលក់ ($)</label><input type="number" step="0.01" id="pPrice" value="${p.price}" required class="w-full px-2.5 py-1.5 border rounded"></div>
                                <div><label class="block mb-1 font-medium">ចំនួនស្តុក</label><input type="number" id="pQty" value="${p.qty}" required class="w-full px-2.5 py-1.5 border rounded"></div>
                            </div>
                            <div><label class="block mb-1 font-medium">លេខកូដ (Code)</label><input type="text" id="pCode" value="${p.code}" class="w-full px-2.5 py-1.5 border rounded"></div>
                            <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded font-bold shadow mt-2">រក្សាទុក</button>
                        </form>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function saveProduct(e, id) {
            e.preventDefault();
            let name = document.getElementById('pName').value;
            let category = document.getElementById('pCat').value;
            let brand = document.getElementById('pBrand').value;
            let cost = parseFloat(document.getElementById('pCost').value) || 0;
            let price = parseFloat(document.getElementById('pPrice').value) || 0;
            let qty = parseInt(document.getElementById('pQty').value) || 0;
            let code = document.getElementById('pCode').value;

            if (id) {
                let idx = appData.products.findIndex(p => p.id === id);
                if (idx !== -1) appData.products[idx] = { id, name, category, brand, cost, price, qty, code };
            } else {
                let newId = appData.products.length ? Math.max(...appData.products.map(p => p.id)) + 1 : 1;
                appData.products.push({ id: newId, name, category, brand, cost, price, qty, code });
            }
            saveData();
            closeModal();
            renderContent();
        }

        function deleteProduct(id) {
            if (confirm("លុបទំនិញនេះមែនទេ?")) {
                appData.products = appData.products.filter(p => p.id !== id);
                saveData();
                renderContent();
            }
        }

        // --- CAMERA BARCODE SCANNER ---
        function openBarcodeScanner(targetContext) {
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center p-4">
                    <div class="bg-white rounded-2xl w-full max-w-md p-4 text-xs">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-sm">ស្កេនបាកូដ / QR Code</h3>
                            <button onclick="closeScannerModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div id="reader" class="w-full overflow-hidden rounded-lg"></div>
                    </div>
                </div>
            `;
            lucide.createIcons();
            setTimeout(() => {
                const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 150 } }, false);
                scanner.render((decodedText) => {
                    scanner.clear().catch(e => console.error(e));
                    closeModal();
                    if (targetContext === 'product') {
                        let searchInput = document.getElementById('productSearch');
                        if (searchInput) { searchInput.value = decodedText; filterProducts(); }
                    } else if (targetContext === 'invoice') {
                        let prod = appData.products.find(p => p.code === decodedText || p.name.includes(decodedText));
                        if (prod) addCartItem(prod.id);
                        else alert("រកមិនឃើញទំនិញដែលមានកូដ: " + decodedText);
                    }
                }, (error) => {});
                window.activeScanner = scanner;
            }, 300);
        }

        function closeScannerModal() {
            if (window.activeScanner) window.activeScanner.clear().catch(e => {});
            closeModal();
        }

        // --- 2. CUSTOMERS TAB ---
        function renderCustomersTab(container) {
            container.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base font-bold text-gray-800">អតិថិជន</h2>
                    <button onclick="openCustomerModal()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1 shadow">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> បញ្ចូលអតិថិជន
                    </button>
                </div>
                <div class="space-y-2">
                    ${appData.customers.map(c => `
                        <div class="bg-white p-3 rounded-xl border shadow-sm flex justify-between items-center text-xs">
                            <div>
                                <p class="font-bold text-gray-800">${c.name}</p>
                                <p class="text-emerald-600"><i data-lucide="phone" class="w-3 h-3 inline"></i> ${c.phone}</p>
                                <p class="text-gray-500">${c.address || ''}</p>
                            </div>
                            <button onclick="deleteCustomer(${c.id})" class="text-red-500 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    `).join('')}
                </div>
            `;
            lucide.createIcons();
        }

        function openCustomerModal() {
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl w-full max-w-sm p-4 text-xs">
                        <div class="flex justify-between items-center mb-3">

        function addCartItem(productId) {
            let prod = appData.products.find(p => p.id === productId);
            if (prod) {
                let exist = invoiceCart.find(i => i.id === productId);
                if (exist) exist.qty += 1;
                else invoiceCart.push({ id: prod.id, name: prod.name, brand: prod.brand || '', code: prod.code, price: prod.price, qty: 1 });
            }
            renderContent();
        }

        function updateCartQty(id, qty) {
            let item = invoiceCart.find(i => i.id === id);
            if (item) item.qty = Math.max(1, parseInt(qty) || 1);
            renderContent();
        }

        function updateCartPrice(id, price) {
            let item = invoiceCart.find(i => i.id === id);
            if (item) item.price = Math.max(0, parseFloat(price) || 0);
            renderContent();
        }

        function removeFromCart(id) {
            invoiceCart = invoiceCart.filter(i => i.id !== id);
            renderContent();
        }

        function calculateCartTotal() {
            return invoiceCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        }

            let customer = document.getElementById('invCustomer').value;

            let total = calculateCartTotal();
            let invNo = `${appData.store.prefix}-${Math.floor(1000 + Math.random() * 9000)}`;

            let newInv = { invNo, customer, date, items: [...invoiceCart], total, currency: invoiceCurrency, status };

        }

        function saveSettings(e) {
            e.preventDefault();
            appData.store.name = document.getElementById('sName').value;
            appData.store.phone = document.getElementById('sPhone').value;

            renderContent();

                    </div>
                </div>
            `;
            lucide.createIcons();

        function saveAdminAbout() {

            saveData();
            alert("កែសម្រួលអំពីយើងបានជោគជ័យ!");
            closeModal();
            renderContent();
        }

            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">

                            <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="bg-gray-800 p-3 rounded-xl space-y-1.5 border border-gray-700">
                            <p class="font-bold text-white">ព័ត៌មានគណនី ABA[span_1](start_span)[span_1](end_span):</p>
                            <p class="text-gray-300">ឈ្មោះ: <b class="text-white">MOM SAMEAN</b>[span_2](start_span)[span_2](end_span)</p>
                            <p class="text-gray-300">លេខគណនី: <b class="text-yellow-400 font-mono text-sm">000 705 882</b>[span_3](start_span)[span_3](end_span)</p>
                            <div class="pt-2">
                                <a href="https://pay.ababank.com/oRF8/lgcw299a" target="_blank" class="block text-center bg-blue-600 text-white py-2 rounded font-bold shadow hover:bg-blue-500">
                                    ចុចទីនេះដើម្បីទូទាត់តាម ABA Link[span_4](start_span)[span_4](end_span)
                                </a>
                            </div>
                        </div>
                        <div class="text-[11px] text-gray-300 leading-relaxed">
                            <p>• ប្រើប្រាស់ឥតគិតថ្លៃរយៈពេល ១ ខែដំបូង[span_5](start_span)[span_5](end_span)!</p>
                            <p>• បន្ទាប់មកតម្លៃត្រឹមតែ <b class="text-yellow-400">២ ដុល្លារ / ខែ</b>[span_6](start_span)[span_6](end_span)។</p>
                        </div>
                        <div class="space-y-2 pt-2 border-t border-gray-800">
                            <label class="block font-medium text-gray-300">បញ្ចូលលេខកូដសកម្មភាព (Activation Code):</label>
                            <div class="flex gap-2">
                                <input type="text" id="activationCodeInput" placeholder="បញ្ចូលលេខកូដ..." class="flex-1 p-2 bg-gray-800 border border-gray-700 rounded text-white focus:outline-none focus:border-yellow-400">
                                <button onclick="verifyActivationCode()" class="bg-yellow-400 text-gray-900 px-4 py-2 rounded font-bold hover:bg-yellow-500">បញ្ជាក់</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function verifyActivationCode() {
            let code = document.getElementById('activationCodeInput').value.trim();
            if (code === "SAMEAN168" || code === "PREMIUM2026") {
                appData.isPremium = true;
                saveData();
                alert("អបអរសាទរ! គណនីរបស់អ្នកត្រូវបានដំឡើងជា Premium ជោគជ័យ!");
                closeModal();
                renderContent();
            } else {
                alert("លេខកូដមិនត្រឹមត្រូវទេ! សូមទាក់ទង Admin តាម Telegram: https://t.me/SameanMom168[span_7](start_span)[span_7](end_span)");
            }
        }

        // Export & Import Backup
        function exportData() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `khmer_pos_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            let fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function(e) {
                    try {
                        let parsedData = JSON.parse(e.target.result);
                        if (parsedData && parsedData.products && parsedData.store) {
                            appData = parsedData;
                            saveData();
                            alert("ទាញយកទិន្នន័យចូលវិញ (Restore) បានជោគជ័យ!");
                            renderContent();
                        } else alert("ឯកសារមិនត្រឹមត្រូវទេ!");
                    } catch (error) { alert("មានបញ្ហាក្នុងការអានឯកសារ!"); }
                };
            }
        }

        function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

        // Initial Render
        renderContent();
    </script>
