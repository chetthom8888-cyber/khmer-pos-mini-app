<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហាងលក់ទំនិញខេមរៈ (Khmer Mini POS)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Html5-Qrcode for Camera Scanning -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Kantumruy Pro', 'Battambang', sans-serif;
            background-color: #111827; /* Dark background for full app performance/feel */
            color: #f3f4f6;
            -webkit-user-select: text;
            user-select: text;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #1f2937; /* Dark Mode Container */
            min-height: 100vh;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            padding-bottom: 90px;
        }
        /* Global Dark Mode Keyboard & Input Optimization */
        input, select, textarea {
            background-color: #374151 !important;
            color: #ffffff !important;
            border-color: #4b5563 !important;
        }
        input::placeholder, textarea::placeholder {
            color: #9ca3af !important;
        }
    </style>
</head>
<body class="text-gray-100">

    <div id="authWrapper"></div>
    <div id="appWrapper" class="app-container flex flex-col justify-between hidden">
        
        <!-- Header -->
        <header class="bg-emerald-800 text-white p-4 sticky top-0 z-40 shadow-md">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="bg-white text-emerald-800 font-bold px-2 py-1 rounded text-sm">POS</div>
                    <div>
                        <h1 id="headerStoreName" class="font-bold text-lg leading-tight">ហាងលក់ទំនិញខេមរៈ</h1>
                        <p class="text-xs text-emerald-200 flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-green-400 inline-block"></span> តភ្ជាប់ Telegram ជោគជ័យ
                        </p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="switchTab('settings')" class="p-1.5 hover:bg-emerald-700 rounded-full">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Viewport -->
        <main id="mainContent" class="p-4 flex-1 overflow-y-auto">
            <!-- Dynamic Content -->
        </main>

        <!-- Fixed Bottom Navigation (6 Buttons) -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-gray-900 border-t border-gray-800 z-50 shadow-lg">
            <div class="grid grid-cols-6 py-2 text-center text-xs">
                <button onclick="switchTab('products')" id="nav-products" class="flex flex-col items-center justify-center text-emerald-400 font-bold">
                    <i data-lucide="box" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ទំនិញ</span>
                </button>
                <button onclick="switchTab('customers')" id="nav-customers" class="flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400">
                    <i data-lucide="users" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">អតិថិជន</span>
                </button>
                <button onclick="switchTab('invoices')" id="nav-invoices" class="flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400">
                    <i data-lucide="receipt" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">វិក្កយបត្រ</span>
                </button>
                <button onclick="switchTab('finance')" id="nav-finance" class="flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400">
                    <i data-lucide="wallet" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ចំណូលចំណាយ</span>
                </button>
                <button onclick="switchTab('stock')" id="nav-stock" class="flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400">
                    <i data-lucide="layers" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ស្តុកទំនិញ</span>
                </button>
                <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400">
                    <i data-lucide="settings" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ការកំណត់</span>
                </button>
            </div>
            <div class="bg-gray-950 text-center py-1 text-[10px] text-gray-500 border-t border-gray-800 select-all">
                @KhmerPosAppBot
            </div>
        </nav>

    </div>

    <!-- Modals Container -->
    <div id="modalContainer"></div>

    <!-- Application Script -->
    <script>
        let currentUser = JSON.parse(localStorage.getItem('khmer_pos_user')) || null;
        let appData = JSON.parse(localStorage.getItem('khmer_pos_data_v11')) || {
            store: { 
                name: "ហាងលក់ទំនិញខេមរៈ", 
                phone: "+855 96 444 4679", 
                address: "ផ្ទះលេខ ១២៣, ភ្នំពេញ", 
                prefix: "INV",
                aboutTitle: "អំពីប្រព័ន្ធ Khmer POS & បណ្តាញ Mini Apps",
                aboutDesc: "ប្រព័ន្ធគ្រប់គ្រងការលក់ ស្តុកទំនិញ ចំណូល-ចំណាយ និងវិក្កយបត្រដ៏មានឥទ្ធិពល រចនាឡើងយ៉ាងពិសេសសម្រាប់អាជីវកម្មខ្នាតតូច និងមធ្យមនៅកម្ពុជា។ ទំនាក់ទំនង Admin: https://t.me/SameanMom168",
                miniapps: [
                    { name: "Khmer POS App", desc: "គ្រប់គ្រងការលក់ និងស្តុកទំនិញ", link: "https://t.me/KhmerPosAppBot" },
                    { name: "Invoice Khmer", desc: "ប្រព័ន្ធបង្កើតវិក្កយបត្ររហ័ស", link: "https://t.me/invoice_khmer_888_bot" },
                    { name: "Sales Planner Pro", desc: "ផែនការលក់ និងគ្រប់គ្រងហិរញ្ញវត្ថុ", link: "https://t.me/sales_planner_bot" }
                ]
            },
            products: [
                { id: 1, name: "កូកាកូឡា (Coca Cola)", category: "ភេសជ្ជៈ", brand: "CocaCola", cost: 0.50, price: 0.75, qty: 120, code: "PRD-001", desc: "កំប៉ុង" },
                { id: 2, name: "កាហ្វេទឹកដោះគោ", category: "ភេសជ្ជៈ", brand: "Cafe", cost: 1.00, price: 1.50, qty: 50, code: "PRD-002", desc: "ដប" }
            ],
            categories: ["ទាំងអស់", "ភេសជ្ជៈ", "ចំណីអាហារ", "សម្ភារប្រើប្រាស់"],
            customers: [
                { id: 1, name: "លោក សុខ ជា", phone: "011 222 333", address: "តាខ្មៅ", note: "" }
            ],
            invoices: [],
            finances: [],
            isPremium: false
        };

        let showFullPrivacy = false;

        function saveData() {
            localStorage.setItem('khmer_pos_data_v11', JSON.stringify(appData));
            document.getElementById('headerStoreName').innerText = appData.store.name;
        }

        let currentTab = 'products';
        let activeCategory = 'ទាំងអស់';
        let invoiceCart = [];
        let invoiceCurrency = '$';

        function checkAuth() {
            if (!currentUser) {
                document.getElementById('authWrapper').classList.remove('hidden');
                document.getElementById('appWrapper').classList.add('hidden');
                renderAuthScreen();
            } else {
                document.getElementById('authWrapper').classList.add('hidden');
                document.getElementById('appWrapper').classList.remove('hidden');
                renderContent();
            }
        }

        function renderAuthScreen() {
            let authDiv = document.getElementById('authWrapper');
            authDiv.innerHTML = `
                <div class="max-w-[480px] mx-auto min-h-screen bg-gray-900 text-white flex flex-col justify-center p-6 shadow-lg">
                    <div class="text-center mb-6">
                        <div class="bg-emerald-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3 font-bold text-xl shadow">POS</div>
                        <h2 class="text-xl font-bold">ស្វាគមន៍មកកាន់ Khmer POS</h2>
                        <p class="text-xs text-gray-400 mt-1">សូមចូល ឬបង្កើតគណនីរបស់អ្នកដើម្បីចាប់ផ្តើម</p>
                    </div>
                    <form onsubmit="handleAuth(event)" class="space-y-3 text-xs">
                        <div>
                            <label class="block mb-1 font-medium text-gray-300">លេខទូរស័ព្ទ *</label>
                            <input type="text" id="authPhone" placeholder="ឧ. +855964444679" required class="w-full p-2.5 bg-gray-800 border border-gray-700 text-white rounded-lg focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block mb-1 font-medium text-gray-300">លេខកូដសម្ងាត់ (Password) *</label>
                            <input type="password" id="authPass" placeholder="••••••••" required class="w-full p-2.5 bg-gray-800 border border-gray-700 text-white rounded-lg focus:outline-none focus:border-emerald-500">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold shadow hover:bg-emerald-500 mt-2">ចូល / បង្កើតគណនី</button>
                    </form>
                </div>
            `;
        }

        function handleAuth(e) {
            e.preventDefault();
            let phone = document.getElementById('authPhone').value.trim();
            let pass = document.getElementById('authPass').value.trim();
            currentUser = { phone, pass };
            localStorage.setItem('khmer_pos_user', JSON.stringify(currentUser));
            checkAuth();
        }

        function logoutUser() {
            if (confirm("តើអ្នកចង់ចាកចេញពីគណនីមែនទេ?")) {
                localStorage.removeItem('khmer_pos_user');
                currentUser = null;
                checkAuth();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            ['products', 'customers', 'invoices', 'finance', 'stock', 'settings'].forEach(t => {
                let btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    btn.className = t === tab 
                        ? "flex flex-col items-center justify-center text-emerald-400 font-bold" 
                        : "flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400";
                }
            });
            renderContent();
        }

        function renderContent() {
            let main = document.getElementById('mainContent');
            if (currentTab === 'products') renderProductsTab(main);
            else if (currentTab === 'customers') renderCustomersTab(main);
            else if (currentTab === 'invoices') renderInvoicesTab(main);
            else if (currentTab === 'finance') renderFinanceTab(main);
            else if (currentTab === 'stock') renderStockTab(main);
            else if (currentTab === 'settings') renderSettingsTab(main);
            lucide.createIcons();
        }

        // --- 1. PRODUCTS TAB ---
        function renderProductsTab(container) {
            container.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base font-bold text-gray-100">គ្រប់គ្រងទំនិញ</h2>
                    <button onclick="openProductModal()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1 shadow">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> បញ្ចូលទំនិញ
                    </button>
                </div>
                <div class="flex gap-2 mb-3">
                    <div class="relative flex-1">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-gray-400"></i>
                        <input type="text" id="productSearch" oninput="filterProducts()" placeholder="ស្វែងរកឈ្មោះ ឬ លេខកូដ..." class="w-full pl-9 pr-3 py-2 border rounded-lg text-xs focus:outline-none focus:border-emerald-500">
                    </div>
                    <button onclick="openBarcodeScanner('product')" class="bg-gray-700 text-white px-3 py-2 rounded-lg text-xs flex items-center gap-1 shadow">
                        <i data-lucide="camera" class="w-4 h-4"></i> ស្កេន
                    </button>
                </div>
                <div class="mb-3">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[11px] font-bold text-gray-400">ប្រភេទទំនិញ:</span>
                        <div class="flex gap-2">
                            <button onclick="addCategoryPrompt()" class="text-[11px] text-emerald-400 font-bold flex items-center gap-0.5"><i data-lucide="plus" class="w-3 h-3"></i> បន្ថែម</button>
                            <button onclick="manageCategoriesModal()" class="text-[11px] text-gray-300 font-bold flex items-center gap-0.5"><i data-lucide="settings" class="w-3 h-3"></i> កែប្រែ/លុប</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
                        ${appData.categories.map(cat => `
                            <button onclick="setCategory('${cat}')" class="px-2.5 py-1 rounded-full text-xs shrink-0 ${activeCategory === cat ? 'bg-emerald-600 text-white font-bold' : 'bg-gray-800 text-gray-300 border border-gray-700'}">
                                ${cat}
                            </button>
                        `).join('')}
                    </div>
                </div>
                <div id="productListContainer" class="space-y-2.5">${renderProductItems()}</div>
            `;
            lucide.createIcons();
        }

        function renderProductItems(query = '') {
            let filtered = appData.products.filter(p => {
                let matchCat = activeCategory === 'ទាំងអស់' || p.category === activeCategory;
                let matchQ = p.name.toLowerCase().includes(query.toLowerCase()) || p.code.toLowerCase().includes(query.toLowerCase());
                return matchCat && matchQ;
            });
            if (filtered.length === 0) return `<div class="text-center py-6 text-gray-500 text-xs">រកមិនឃើញទំនិញ</div>`;
            return filtered.map(p => `
                <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 shadow-sm flex justify-between items-center text-xs">
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h3 class="font-bold text-gray-100">${p.name}</h3>
                            <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-[10px] px-1.5 py-0.5 rounded">${p.category}</span>
                        </div>
                        <p class="text-gray-400 mt-0.5">កូដ: ${p.code} | ស្តុក: <span class="font-bold text-gray-200">${p.qty}</span></p>
                        <p class="text-emerald-400 font-bold mt-0.5">តម្លៃលក់: $${p.price.toFixed(2)} (ដើម: $${p.cost.toFixed(2)})</p>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="openProductModal(${p.id})" class="p-1.5 text-gray-300 hover:bg-gray-700 rounded"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button onclick="deleteProduct(${p.id})" class="p-1.5 text-red-400 hover:bg-red-950 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            let q = document.getElementById('productSearch').value;
            document.getElementById('productListContainer').innerHTML = renderProductItems(q);
            lucide.createIcons();
        }

        function setCategory(cat) { activeCategory = cat; renderContent(); }

        function addCategoryPrompt() {
            let name = prompt("បញ្ចូលឈ្មោះប្រភេទទំនិញថ្មី៖");
            if (name && name.trim()) {
                if (!appData.categories.includes(name.trim())) {
                    appData.categories.push(name.trim());
                    saveData();
                    renderContent();
                } else alert("មានរួចហើយ!");
            }
        }

        function manageCategoriesModal() {
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
                    <div class="bg-gray-900 text-white rounded-2xl w-full max-w-sm p-4 text-xs border border-gray-800">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-sm">គ្រប់គ្រងប្រភេទទំនិញ</h3>
                            <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="space-y-2 max-h-60 overflow-y-auto mb-3">
                            ${appData.categories.filter(c => c !== 'ទាំងអស់').map(c => `
                                <div class="flex justify-between items-center bg-gray-800 p-2 rounded border border-gray-700">
                                    <span>${c}</span>
                                    <button onclick="deleteCategory('${c}')" class="text-red-400 hover:bg-red-950 p-1 rounded"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="closeModal(); renderContent();" class="w-full bg-emerald-600 text-white py-2 rounded font-bold">រួចរាល់</button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function deleteCategory(cat) {
            if (confirm(`តើអ្នកចង់លុបប្រភេទ "${cat}" មែនទេ?`)) {
                appData.categories = appData.categories.filter(c => c !== cat);
                if (activeCategory === cat) activeCategory = 'ទាំងអស់';
                saveData();
                manageCategoriesModal();
            }
        }

        function openProductModal(id = null) {
            let p = id ? appData.products.find(item => item.id === id) : { name: '', category: appData.categories[1] || 'ផ្សេងៗ', brand: '', cost: 0, price: 0, qty: 1, desc: '', code: 'PRD-' + Math.floor(1000 + Math.random() * 9000) };
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
                    <div class="bg-gray-900 text-white rounded-2xl w-full max-w-md p-4 text-xs max-h-[90vh] overflow-y-auto border border-gray-800">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-sm">${id ? 'កែសម្រួលទំនិញ' : 'បញ្ចូលទំនិញថ្មី'}</h3>
                            <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="saveProduct(event, ${id})" class="space-y-2.5">
                            <div><label class="block mb-1 font-medium text-gray-300">ឈ្មោះទំនិញ *</label><input type="text" id="pName" value="${p.name}" required class="w-full px-2.5 py-1.5 border rounded"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <div><label class="block mb-1 font-medium text-gray-300">ប្រភេទទំនិញ</label><select id="pCat" class="w-full px-2.5 py-1.5 border rounded">${appData.categories.filter(c => c !== 'ទាំងអស់').map(c => `<option value="${c}" ${p.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
                                <div><label class="block mb-1 font-medium text-gray-300">ម៉ាក (Brand)</label><input type="text" id="pBrand" value="${p.brand || ''}" class="w-full px-2.5 py-1.5 border rounded"></div>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <div><label class="block mb-1 font-medium text-gray-300">តម្លៃដើម ($)</label><input type="number" step="0.01" id="pCost" value="${p.cost}" class="w-full px-2.5 py-1.5 border rounded"></div>
                                <div><label class="block mb-1 font-medium text-gray-300">តម្លៃលក់ ($)</label><input type="number" step="0.01" id="pPrice" value="${p.price}" required class="w-full px-2.5 py-1.5 border rounded"></div>
                                <div><label class="block mb-1 font-medium text-gray-300">ចំនួនស្តុក</label><input type="number" id="pQty" value="${p.qty}" required class="w-full px-2.5 py-1.5 border rounded"></div>
                            </div>
                            <div><label class="block mb-1 font-medium text-gray-300">លេខកូដ (Code)</label><input type="text" id="pCode" value="${p.code}" class="w-full px-2.5 py-1.5 border rounded"></div>
                            <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded font-bold shadow mt-2">រក្សាទុក</button>
                        </form>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function saveProduct(e, id) {
            e.preventDefault();
            let name = document.getElementById('pName').value;
            let category = document.getElementById('pCat').value;
            let brand = document.getElementById('pBrand').value;
            let cost = parseFloat(document.getElementById('pCost').value) || 0;
            let price = parseFloat(document.getElementById('pPrice').value) || 0;
            let qty = parseInt(document.getElementById('pQty').value) || 0;
            let code = document.getElementById('pCode').value;

            if (id) {
                let idx = appData.products.findIndex(p => p.id === id);
                if (idx !== -1) appData.products[idx] = { id, name, category, brand, cost, price, qty, code };
            } else {
                let newId = appData.products.length ? Math.max(...appData.products.map(p => p.id)) + 1 : 1;
                appData.products.push({ id: newId, name, category, brand, cost, price, qty, code });

            closeModal();
            renderContent();

        function openBarcodeScanner(targetContext) {
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center p-4">
                    <div class="bg-gray-900 text-white rounded-2xl w-full max-w-md p-4 text-xs border border-gray-800">

                            <button onclick="closeScannerModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div id="reader" class="w-full overflow-hidden rounded-lg"></div>
                    </div>
                </div>
            `;
            lucide.createIcons();
            setTimeout(() => {
                const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 150 } }, false);
                scanner.render((decodedText) => {
                    scanner.clear().catch(e => console.error(e));
                    closeModal();
                    if (targetContext === 'product') {
                        let searchInput = document.getElementById('productSearch');
                        if (searchInput) { searchInput.value = decodedText; filterProducts(); }
                    } else if (targetContext === 'invoice') {
                        let prod = appData.products.find(p => p.code === decodedText || p.name.includes(decodedText));
                        if (prod) addCartItem(prod.id);
                        else alert("រកមិនឃើញទំនិញដែលមានកូដ: " + decodedText);
                    }
                }, (error) => {});
                window.activeScanner = scanner;
            }, 300);
        }

        function closeScannerModal() {
            if (window.activeScanner) window.activeScanner.clear().catch(e => {});

        function addCartItem(productId) {
            let prod = appData.products.find(p => p.id === productId);
            if (prod) {
                let exist = invoiceCart.find(i => i.id === productId);
                if (exist) exist.qty += 1;
                else invoiceCart.push({ id: prod.id, name: prod.name, brand: prod.brand || '', code: prod.code, price: prod.price, qty: 1 });
            }
            renderContent();
        }

        function updateCartQty(id, qty) {
            let item = invoiceCart.find(i => i.id === id);
            if (item) item.qty = Math.max(1, parseInt(qty) || 1);
            renderContent();
        }

        function updateCartPrice(id, price) {
            let item = invoiceCart.find(i => i.id === id);
            if (item) item.price = Math.max(0, parseFloat(price) || 0);
            renderContent();
        }

        function removeFromCart(id) {
            invoiceCart = invoiceCart.filter(i => i.id !== id);
            renderContent();
        }

        function calculateCartTotal() {
            return invoiceCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        }

            let invNo = `${appData.store.prefix}-${Math.floor(1000 + Math.random() * 9000)}`;

            let newInv = { invNo, customer, date, items: [...invoiceCart], total, currency: invoiceCurrency, status };

                appData.finances.push({ id: Date.now(), type: 'income', title: `លក់វិក្កយបត្រ ${invNo}`, amount: total, date });

            invoiceCart = [];

            lucide.createIcons();
        }

        // --- 6. SETTINGS TAB ---
        function renderSettingsTab(container) {
            let isTrueAdmin = currentUser && (currentUser.phone === "+855 96 444 4679" || currentUser.phone === "0964444679");

            container.innerHTML = `
                <div class="mb-3"><h2 class="text-base font-bold text-gray-100">ការកំណត់ប្រព័ន្ធ</h2></div>
                <div class="space-y-3 text-xs">
                    <!-- Account Info -->
                    <div class="bg-gray-800 border border-gray-700 p-3 rounded-xl space-y-2">
                        <h3 class="font-bold text-emerald-400">គណនីរបស់អ្នក</h3>
                        <p class="text-gray-300">លេខទូរស័ព្ទ: <b class="text-white">${currentUser.phone}</b></p>
                        <button onclick="shareAccountToTelegram()" class="w-full bg-blue-600 text-white py-2 rounded font-bold shadow flex items-center justify-center gap-1">
                            <i data-lucide="send" class="w-3.5 h-3.5"></i> ចែករំលែកគណនីទៅ Save Telegram
                        </button>
                        <button onclick="logoutUser()" class="w-full bg-red-950 text-red-400 border border-red-800 py-1.5 rounded font-bold">ចាកចេញពីគណនី (Logout)</button>
                    </div>

                    <!-- Store Settings -->
                    <form onsubmit="saveSettings(event)" class="bg-gray-800 p-3 rounded-xl border border-gray-700 shadow-sm space-y-2.5">
                        <h3 class="font-bold text-emerald-400">ព័ត៌មានហាង</h3>
                        <div><label class="block mb-1 text-gray-300">ឈ្មោះហាង</label><input type="text" id="sName" value="${appData.store.name}" required class="w-full p-2 border rounded"></div>
                        <div><label class="block mb-1 text-gray-300">លេខទូរស័ព្ទហាង</label><input type="text" id="sPhone" value="${appData.store.phone}" required class="w-full p-2 border rounded"></div>
                        
                        <!-- About Us Section -->
                        <div class="pt-2 border-t border-gray-700 space-y-2">
                            <div class="flex justify-between items-center">
                                <label class="block font-bold text-blue-400">កន្លែង «អំពីយើង» & បណ្តាញ Mini Apps</label>
                                ${isTrueAdmin ? `<span class="bg-blue-950 text-blue-400 border border-blue-800 text-[10px] px-2 py-0.5 rounded font-bold">Admin Mode</span>` : ''}
                            </div>
                            
                            ${isTrueAdmin ? `
                                <div class="bg-gray-900 text-white p-3 rounded-xl space-y-3 border border-gray-700">
                                    <p class="text-[11px] text-yellow-400 font-bold">⚙️ កែសម្រួលព័ត៌មាន និងតំណភ្ជាប់ (Dark Mode)</p>
                                    <div>
                                        <label class="block text-gray-300 mb-1">ចំណងជើង:</label>
                                        <input type="text" id="sAboutTitle" value="${appData.store.aboutTitle || ''}" class="w-full p-2 bg-gray-800 border border-gray-700 text-white rounded text-xs">
                                    </div>
                                    <div>
                                        <label class="block text-gray-300 mb-1">អត្ថបទពិពណ៌នា និង តំណភ្ជាប់ (Links):</label>
                                        <textarea id="sAboutDesc" rows="3" class="w-full p-2 bg-gray-800 border border-gray-700 text-white rounded text-xs">${appData.store.aboutDesc || ''}</textarea>
                                    </div>
                                    <div>
                                        <div class="flex justify-between items-center mb-1">
                                            <label class="text-gray-300 font-bold">បញ្ជី Mini Apps:</label>
                                            <button type="button" onclick="addMiniAppField()" class="bg-emerald-600 text-white px-2 py-0.5 rounded text-[10px] font-bold">+ បន្ថែម Mini App</button>
                                        </div>
                                        <div id="miniAppsListContainer" class="space-y-2 max-h-48 overflow-y-auto">
                                             ${(appData.store.miniapps || []).map((app, idx) => `
                                                <div class="mini-app-row bg-gray-800 p-2 rounded border border-gray-700 space-y-1 text-xs">
                                                    <div class="flex justify-between">
                                                        <span class="text-gray-400">Mini App #${idx + 1}</span>
                                                        <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-red-400 text-[10px]">លុប</button>
                                                    </div>
                                                    <input type="text" placeholder="ឈ្មោះ Mini App" value="${app.name}" class="app-name w-full p-1 bg-gray-900 border border-gray-700 text-white rounded">
                                                    <input type="text" placeholder="ពិពណ៌នាខ្លី" value="${app.desc}" class="app-desc w-full p-1 bg-gray-900 border border-gray-700 text-white rounded">
                                                    <input type="text" placeholder="Telegram Link" value="${app.link}" class="app-link w-full p-1 bg-gray-900 border border-gray-700 text-white rounded">
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            ` : `
                                <div class="bg-gray-900 p-3 rounded-lg border border-gray-700 space-y-2 text-xs">
                                    <h4 class="font-bold text-gray-100 text-sm">${appData.store.aboutTitle || 'អំពីយើង'}</h4>
                                    <p class="text-gray-300 leading-relaxed">${formatTextWithLinks(appData.store.aboutDesc || '')}</p>
                                    
                                    <div class="pt-2 border-t border-gray-800">
                                        <p class="font-bold text-emerald-400 mb-1.5">🔗 បណ្តាញ Mini Apps ផ្លូវការ:</p>
                                        <div class="space-y-1.5">
                                            ${(appData.store.miniapps || []).map(app => `
                                                <a href="${app.link}" target="_blank" class="block bg-gray-800 p-2 rounded border border-gray-700 shadow-sm hover:border-emerald-500 transition">
                                                    <p class="font-bold text-emerald-400">${app.name}</p>
                                                    <p class="text-[10px] text-gray-400">${app.desc}</p>
                                                </a>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            `}
                        </div>

                        <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded font-bold shadow mt-2">រក្សាទុក</button>
                    </form>

                    <!-- Privacy Policy & Terms Section -->
                    <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 shadow-sm space-y-2 text-xs">
                        <h3 class="font-bold text-emerald-400 flex items-center gap-1">
                            <i data-lucide="shield-check" class="w-4 h-4"></i> ឯកជនភាព និងគោលការណ៍ប្រើប្រាស់
                        </h3>
                        <p class="text-gray-300 leading-relaxed">
                            ប្រព័ន្ធ Khmer POS ត្រូវបានបង្កើតឡើងក្នុងគោលបំណងជួយសម្រួលដល់ការគ្រប់គ្រងអាជីវកម្មខ្នាតតូច និងមធ្យមនៅកម្ពុជា...
                        </p>
                        
                        ${showFullPrivacy ? `
                            <div class="space-y-2 pt-2 border-t border-gray-700 text-gray-300 leading-relaxed">
                                <p><b>១. ការការពារទិន្នន័យ (Data Privacy):</b> រាល់ព័ត៌មានស្តុកទំនិញ អតិថិជន និងវិក្កយបត្រ គឺត្រូវបានរក្សាទុកក្នុង Local Storage របស់ឧបករណ៍អ្នកផ្ទាល់។</p>
                                <p><b>២. ការប្រើប្រាស់សេវាកម្ម (Service Terms):</b> អ្នកប្រើប្រាស់ត្រូវរក្សាការពារព័ត៌មានគណនីរបស់ខ្លួនឱ្យបានល្អ។</p>
                            </div>
                        ` : ''}

                        <button type="button" onclick="togglePrivacy()" class="w-full bg-gray-700 text-emerald-400 py-1.5 rounded font-bold hover:bg-gray-600 transition mt-1">
                            ${showFullPrivacy ? 'បង្ហាញតិចជាងមុន (See Less)' : 'អានបន្ថែម (See More)'}
                        </button>
                    </div>

                    <!-- Premium Plan Card -->
                    <div class="bg-gray-900 text-white p-4 rounded-xl border border-gray-700 shadow-lg space-y-3">
                        <div class="flex items-center gap-2">
                            <div class="bg-yellow-400 text-gray-900 p-1.5 rounded-full"><i data-lucide="star" class="w-4 h-4 fill-current"></i></div>
                            <div>
                                <h3 class="font-bold text-sm">គម្រោង Premium</h3>
                                <p class="text-[10px] text-gray-300">ស្ថានភាព: <span class="${appData.isPremium ? 'text-green-400 font-bold' : 'text-yellow-400 font-bold'}">${appData.isPremium ? 'សកម្ម (Active)' : 'សាកល្បងឥតគិតថ្លៃ ១ ខែ'}</span></p>
                            </div>
                        </div>
                        <ul class="space-y-1.5 text-[11px] text-gray-300">
                            <li class="flex items-center gap-1.5"><i data-lucide="check" class="w-3.5 h-3.5 text-green-400"></i> បង្កើតវិក្កយបត្រឥតដែនកំណត់</li>
                            <li class="flex items-center gap-1.5"><i data-lucide="check" class="w-3.5 h-3.5 text-green-400"></i> ប្រើប្រាស់បានច្រើនទូរស័ព្ទ</li>
                        </ul>
                        <button onclick="openPremiumModal()" class="w-full bg-yellow-400 text-gray-900 py-2 rounded-lg font-bold hover:bg-yellow-500 shadow text-xs">
                            ${appData.isPremium ? 'គ្រប់គ្រង Premium' : 'ទិញ / បញ្ចូលកូដ Premium ($2/ខែ)'}
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function formatTextWithLinks(text) {
            let urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" class="text-blue-400 underline font-medium">${url}</a>`;
            });
        }

        function togglePrivacy() {
            showFullPrivacy = !showFullPrivacy;
            renderContent();
        }

        function addMiniAppField() {
            let container = document.getElementById('miniAppsListContainer');
            let div = document.createElement('div');
            div.className = "mini-app-row bg-gray-800 p-2 rounded border border-gray-700 space-y-1 text-xs mt-2";
            div.innerHTML = `
                <div class="flex justify-between">
                    <span class="text-gray-400">Mini App ថ្មី</span>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-red-400 text-[10px]">លុប</button>
                </div>
                <input type="text" placeholder="ឈ្មោះ Mini App" class="app-name w-full p-1 bg-gray-900 border border-gray-700 text-white rounded">
                <input type="text" placeholder="ពិពណ៌នាខ្លី" class="app-desc w-full p-1 bg-gray-900 border border-gray-700 text-white rounded">
                <input type="text" placeholder="Telegram Link" class="app-link w-full p-1 bg-gray-900 border border-gray-700 text-white rounded">
            `;
            container.appendChild(div);
        }

        function shareAccountToTelegram() {
            let text = `📱 ព័ត៌មានគណនី Khmer POS របស់ខ្ញុំ:\n📞 លេខទូរស័ព្ទ: ${currentUser.phone}\n🔑 លេខសម្ងាត់: ${currentUser.pass}\nហាង: ${appData.store.name}`;
            if (navigator.share) {
                navigator.share({ title: 'Khmer POS Account', text: text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text);
                alert("បានចម្លងព័ត៌មានគណនីរួចរាល់!");
            }
        }

        function saveSettings(e) {
            e.preventDefault();
            appData.store.name = document.getElementById('sName').value;
            appData.store.phone = document.getElementById('sPhone').value;
            
            let isTrueAdmin = currentUser && (currentUser.phone === "+855 96 444 4679" || currentUser.phone === "0964444679");
            if (isTrueAdmin) {
                let titleInput = document.getElementById('sAboutTitle');
                let descInput = document.getElementById('sAboutDesc');
                if (titleInput) appData.store.aboutTitle = titleInput.value;
                if (descInput) appData.store.aboutDesc = descInput.value;

                let rows = document.querySelectorAll('.mini-app-row');
                let apps = [];
                rows.forEach(row => {
                    let name = row.querySelector('.app-name').value.trim();
                    let desc = row.querySelector('.app-desc').value.trim();
                    let link = row.querySelector('.app-link').value.trim();
                    if (name) {
                        apps.push({ name, desc, link });
                    }
                });
                appData.store.miniapps = apps;
            }

            saveData();
            alert("រក្សាទុកបានជោគជ័យ!");
            renderContent();
        }

        function openPremiumModal() {
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                    <div class="bg-gray-900 text-white rounded-2xl w-full max-w-md p-5 text-xs space-y-4 border border-gray-800">
                        <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                            <h3 class="font-bold text-sm text-yellow-400">ទូទាត់ប្រាក់កម្រិត Premium</h3>
                            <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="bg-gray-800 p-3 rounded-xl space-y-1.5 border border-gray-700">
                            <p class="font-bold text-white">ព័ត៌មានគណនី ABA:</p>
                            <p class="text-gray-300">ឈ្មោះ: <b class="text-white">MOM SAMEAN</b></p>
                            <p class="text-gray-300">លេខគណនី: <b class="text-yellow-400 font-mono text-sm">000 705 882</b></p>
                        </div>
                        <div class="space-y-2 pt-2 border-t border-gray-800">
                            <label class="block font-medium text-gray-300">បញ្ចូលលេខកូដសកម្មភាព (Activation Code):</label>
                            <div class="flex gap-2">
                                <input type="text" id="activationCodeInput" placeholder="បញ្ចូលលេខកូដ..." class="flex-1 p-2 bg-gray-800 border border-gray-700 rounded text-white focus:outline-none focus:border-yellow-400">
                                <button onclick="verifyActivationCode()" class="bg-yellow-400 text-gray-900 px-4 py-2 rounded font-bold hover:bg-yellow-500">បញ្ជាក់</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function verifyActivationCode() {
            let code = document.getElementById('activationCodeInput').value.trim();
            if (code === "SAMEAN168" || code === "PREMIUM2026") {
                appData.isPremium = true;
                saveData();
                alert("អបអរសាទរ! គណនីរបស់អ្នកត្រូវបានដំឡើងជា Premium ជោគជ័យ!");
                closeModal();
                renderContent();
            } else {
                alert("លេខកូដមិនត្រឹមត្រូវទេ!");
            }
        }

        function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

        checkAuth();
    </script>
</body>
</html>
