<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហាងលក់ទំនិញខេមរៈ (Khmer Mini POS)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Kantumruy Pro & Battambang -->
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas & jsPDF for Receipt Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Kantumruy Pro', 'Battambang', sans-serif;
            background-color: #f3f4f6;
            -webkit-user-select: text;
            user-select: text;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding-bottom: 90px;
        }
        @media (min-width: 768px) {
            body {
                background-color: #e5e7eb;
            }
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="app-container flex flex-col justify-between">
        
        <!-- Header -->
        <header class="bg-emerald-700 text-white p-4 sticky top-0 z-40 shadow-md">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="bg-white text-emerald-700 font-bold px-2 py-1 rounded text-sm">POS</div>
                    <div>
                        <h1 id="headerStoreName" class="font-bold text-lg leading-tight">ហាងលក់ទំនិញខេមរៈ</h1>
                        <p class="text-xs text-emerald-200 flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-green-400 inline-block"></span> តភ្ជាប់ Telegram ជោគជ័យ
                        </p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="alert('គ្មានការជូនដំណឹងថ្មីទេ')" class="p-1.5 hover:bg-emerald-600 rounded-full relative">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                    </button>
                    <button onclick="switchTab('settings')" class="p-1.5 hover:bg-emerald-600 rounded-full">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Viewport -->
        <main id="mainContent" class="p-4 flex-1 overflow-y-auto">
            <!-- Dynamic Content Injected via JS -->
        </main>

        <!-- Fixed Bottom Navigation (6 Buttons) -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t border-gray-200 z-50 shadow-lg">
            <div class="grid grid-cols-6 py-2 text-center text-xs">
                <button onclick="switchTab('products')" id="nav-products" class="flex flex-col items-center justify-center text-emerald-600">
                    <i data-lucide="box" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ទំនិញ</span>
                </button>
                <button onclick="switchTab('customers')" id="nav-customers" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600">
                    <i data-lucide="users" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">អតិថិជន</span>
                </button>
                <button onclick="switchTab('invoices')" id="nav-invoices" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600">
                    <i data-lucide="receipt" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">វិក្កយបត្រ</span>
                </button>
                <button onclick="switchTab('finance')" id="nav-finance" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600">
                    <i data-lucide="wallet" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ចំណូលចំណាយ</span>
                </button>
                <button onclick="switchTab('stock')" id="nav-stock" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600">
                    <i data-lucide="layers" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ស្តុកទំនិញ</span>
                </button>
                <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600">
                    <i data-lucide="settings" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ការកំណត់</span>
                </button>
            </div>
            <div class="bg-gray-50 text-center py-1 text-[10px] text-gray-400 border-t border-gray-100 select-all">
                @KhmerPosAppBot
            </div>
        </nav>

    </div>

    <!-- Modals Container -->
    <div id="modalContainer"></div>

    <!-- JavaScript Application Logic -->
    <script>
        // Initial Data Structure & LocalStorage Sync
        let appData = JSON.parse(localStorage.getItem('khmer_pos_data')) || {
            store: {
                name: "ហាងលក់ទំនិញខេមរៈ",
                phone: "012 345 678",
                address: "ផ្ទះលេខ ១២៣, ផ្លូវ ០០១, ភ្នំពេញ",
                description: "លក់ទំនិញបោះដុំ និងរាយ តម្លៃសមរម្យ",
                logo: "",
                prefix: "INV",
                digits: 4
            },
            products: [
                { id: 1, name: "កូកាកូឡា (Coca Cola)", category: "ភេសជ្ជៈ", cost: 0.50, price: 0.75, qty: 120, code: "PRD-001", desc: "កំប៉ុង ៣២០មីលីលីត្រ" },
                { id: 2, name: "កាហ្វេទឹកដោះគោ", category: "ភេសជ្ជៈ", cost: 1.00, price: 1.50, qty: 50, code: "PRD-002", desc: "កាហ្វេស្រស់ត្រជាក់" },
                { id: 3, name: "នំប៉័ងប៉ាតេ", category: "ចំណីអាហារ", cost: 1.20, price: 2.00, qty: 30, code: "PRD-003", desc: "នំប៉័ងសាច់សាយអ៊ូវ" }
            ],
            categories: ["ទាំងអស់", "ភេសជ្ជៈ", "ចំណីអាហារ", "សម្ភារប្រើប្រាស់", "ផ្សេងៗ"],
            customers: [
                { id: 1, name: "លោក សុខ ជា", phone: "011 222 333", address: "តាខ្មៅ កណ្តាល", note: "អតិថិជនប្រចាំ" },
                { id: 2, name: "អ្នកនាង ចាន់ ដា", phone: "098 777 888", address: "ទួលគោក ភ្នំពេញ", note: "ទិញដុំ" }
            ],
            invoices: [],
            finances: [
                { id: 1, type: "income", title: "លក់ទំនិញថ្ងៃបើកហាង", amount: 25.50, date: "2026-06-01" },
                { id: 2, type: "expense", title: "ទិញកាហ្វេ និងទឹកសុទ្ធ", amount: 10.00, date: "2026-06-01" }
            ],
            stocks: []
        };

        function saveData() {
            localStorage.setItem('khmer_pos_data', JSON.stringify(appData));
            document.getElementById('headerStoreName').innerText = appData.store.name;
        }

        let currentTab = 'products';
        let activeCategory = 'ទាំងអស់';
        let invoiceCart = [];
        let invoiceCurrency = '$';

        function switchTab(tab) {
            currentTab = tab;
            // Highlight active nav
            ['products', 'customers', 'invoices', 'finance', 'stock', 'settings'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    if (t === tab) {
                        btn.className = "flex flex-col items-center justify-center text-emerald-600 font-bold";
                    } else {
                        btn.className = "flex flex-col items-center justify-center text-gray-500 hover:text-emerald-600";
                    }
                }
            });
            renderContent();
        }

        function renderContent() {
            const main = document.getElementById('mainContent');
            lucide.createIcons();
            if (currentTab === 'products') renderProductsTab(main);
            else if (currentTab === 'customers') renderCustomersTab(main);
            else if (currentTab === 'invoices') renderInvoicesTab(main);
            else if (currentTab === 'finance') renderFinanceTab(main);
            else if (currentTab === 'stock') renderStockTab(main);
            else if (currentTab === 'settings') renderSettingsTab(main);
            lucide.createIcons();
        }

        // --- 1. PRODUCTS TAB ---
        function renderProductsTab(container) {
            container.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-lg font-bold text-gray-800">គ្រប់គ្រងទំនិញ</h2>
                        <p class="text-xs text-gray-500">បញ្ជីទំនិញ និងប្រភេទទាំងអស់ក្នុងស្តុក</p>
                    </div>
                    <button onclick="openProductModal()" class="bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm flex items-center gap-1 shadow hover:bg-emerald-700">
                        <i data-lucide="plus" class="w-4 h-4"></i> បញ្ចូលទំនិញ
                    </button>
                </div>

                <!-- Search -->
                <div class="relative mb-3">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="productSearch" oninput="filterProducts()" placeholder="ស្វែងរកឈ្មោះទំនិញ ឬ លេខកូដ..." class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-emerald-500 bg-white">
                </div>

                <!-- Category Pills with Plus -->
                <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-4 scrollbar-none">
                    <button onclick="addCategoryPrompt()" class="bg-gray-200 hover:bg-gray-300 px-2.5 py-1 rounded-full text-xs font-bold text-gray-700 flex items-center gap-1 shrink-0">
                        <i data-lucide="plus" class="w-3 h-3"></i> បន្ថែមប្រភេទ
                    </button>
                    ${appData.categories.map(cat => `
                        <button onclick="setCategory('${cat}')" class="px-3 py-1 rounded-full text-xs font-medium shrink-0 ${activeCategory === cat ? 'bg-emerald-600 text-white' : 'bg-white text-gray-600 border border-gray-200'}">
                            ${cat}
                        </button>
                    `).join('')}
                </div>

                <!-- Product List -->
                <div id="productListContainer" class="space-y-3">
                    ${renderProductItems()}
                </div>
            `;
            lucide.createIcons();
        }

        function renderProductItems(searchQuery = '') {
            let filtered = appData.products.filter(p => {
                const matchCat = activeCategory === 'ទាំងអស់' || p.category === activeCategory;
                const matchQuery = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.code.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchQuery;
            });

            if (filtered.length === 0) {
                return `<div class="text-center py-8 text-gray-400 text-sm">រកមិនឃើញទំនិញ</div>`;
            }

            return filtered.map(p => `
                <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex justify-between items-center">
                    <div>
                        <div class="flex items-center gap-2">
                            <h3 class="font-bold text-gray-800">${p.name}</h3>
                            <span class="bg-emerald-50 text-emerald-700 text-[10px] px-2 py-0.5 rounded-full font-medium">${p.category}</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-0.5">កូដ: ${p.code} | ស្តុក: <span class="font-bold text-gray-700">${p.qty}</span></p>
                        <p class="text-xs text-emerald-600 font-bold mt-1">តម្លៃលក់: $${p.price.toFixed(2)} <span class="text-gray-400 font-normal">(ដើម: $${p.cost.toFixed(2)})</span></p>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="openProductModal(${p.id})" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button onclick="deleteProduct(${p.id})" class="p-2 text-red-500 hover:bg-red-50 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const q = document.getElementById('productSearch').value;
            document.getElementById('productListContainer').innerHTML = renderProductItems(q);
            lucide.createIcons();
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderContent();
        }

        function addCategoryPrompt() {
            const catName = prompt("បញ្ចូលឈ្មោះប្រភេទទំនិញថ្មី៖");
            if (catName && catName.trim() !== "") {
                if (!appData.categories.includes(catName.trim())) {
                    appData.categories.push(catName.trim());
                    saveData();
                    renderContent();
                } else {
                    alert("ប្រភេទទំនិញនេះមានរួចហើយ!");
                }
            }
        }

        function openProductModal(id = null) {
            const p = id ? appData.products.find(item => item.id === id) : { name: '', category: appData.categories[1] || 'ផ្សេងៗ', cost: 0, price: 0, qty: 1, desc: '', code: 'PRD-' + Math.floor(100 + Math.random() * 900) };
            
            const modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl w-full max-w-md p-5 max-h-[90vh] overflow-y-auto">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-gray-800 text-base">${id ? 'កែសម្រួលទំនិញ' : 'បញ្ចូលទំនិញថ្មី'}</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form id="productForm" onsubmit="saveProduct(event, ${id})" class="space-y-3 text-sm">
                            <div>
                                <label class="block text-xs text-gray-600 mb-1 font-medium">ឈ្មោះទំនិញ *</label>
                                <input type="text" id="pName" value="${p.name}" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs text-gray-600 mb-1 font-medium">ប្រភេទទំនិញ</label>
                                    <select id="pCat" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500 bg-white">
                                        ${appData.categories.filter(c => c !== 'ទាំងអស់').map(c => `<option value="${c}" ${p.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-600 mb-1 font-medium">លេខកូដទំនិញ</label>
                                    <input type="text" id="pCode" value="${p.code}" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500">
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <div>
                                    <label class="block text-xs text-gray-600 mb-1 font-medium">តម្លៃដើម ($)</label>
                                    <input type="number" step="0.01" id="pCost" value="${p.cost}" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-600 mb-1 font-medium">តម្លៃលក់ ($)</label>
                                    <input type="number" step="0.01" id="pPrice" value="${p.price}" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500">
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-600 mb-1 font-medium">ចំនួនស្តុក</label>
                                    <input type="number" id="pQty" value="${p.qty}" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-600 mb-1 font-medium">ការរៀបរាប់</label>
                                <textarea id="pDesc" rows="2" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500">${p.desc}</textarea>
                            </div>
                            <div class="pt-2">
                                <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-bold hover:bg-emerald-700 shadow">រក្សាទុក</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function saveProduct(e, id) {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const category = document.getElementById('pCat').value;
            const code = document.getElementById('pCode').value;
            const cost = parseFloat(document.getElementById('pCost').value) || 0;
            const price = parseFloat(document.getElementById('pPrice').value) || 0;
            const qty = parseInt(document.getElementById('pQty').value) || 0;
            const desc = document.getElementById('pDesc').value;

            if (id) {
                let idx = appData.products.findIndex(p => p.id === id);
                if (idx !== -1) {
                    appData.products[idx] = { id, name, category, code, cost, price, qty, desc };
                }
            } else {
                const newId = appData.products.length > 0 ? Math.max(...appData.products.map(p => p.id)) + 1 : 1;
                appData.products.push({ id: newId, name, category, code, cost, price, qty, desc });
            }

            saveData();
            closeModal();
            renderContent();
        }

        function deleteProduct(id) {
            if (confirm("តើអ្នកពិតជាចង់លុបទំនិញនេះមែនទេ?")) {
                appData.products = appData.products.filter(p => p.id !== id);
                saveData();
                renderContent();
            }
        }

        function closeModal() {
            document.getElementById('modalContainer').innerHTML = '';
        }

        // --- 2. CUSTOMERS TAB ---
        function renderCustomersTab(container) {
            container.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <div>
                        <h2 class="text-lg font-bold text-gray-800">គ្រប់គ្រងអតិថិជន</h2>
                        <p class="text-xs text-gray-500">បញ្ជីឈ្មោះ និងព័ត៌មានអតិថិជន</p>
                    </div>
                    <button onclick="openCustomerModal()" class="bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm flex items-center gap-1 shadow hover:bg-emerald-700">
                        <i data-lucide="plus" class="w-4 h-4"></i> បញ្ចូលអតិថិជន
                    </button>
                </div>

                <div class="relative mb-3">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="cusSearch" oninput="filterCustomers()" placeholder="ស្វែងរកឈ្មោះ ឬ លេខទូរស័ព្ទ..." class="w-full pl-9 pr-4 py-2 border rounded-lg text-sm focus:outline-none focus:border-emerald-500 bg-white">
                </div>

                <div id="customerListContainer" class="space-y-3">
                    ${renderCustomerItems()}
                </div>
            `;
            lucide.createIcons();
        }

        function renderCustomerItems(query = '') {
            let filtered = appData.customers.filter(c => c.name.toLowerCase().includes(query.toLowerCase()) || c.phone.includes(query));
            if (filtered.length === 0) return `<div class="text-center py-8 text-gray-400 text-sm">គ្មានទិន្នន័យអតិថិជន</div>`;

            return filtered.map(c => `
                <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-gray-800">${c.name}</h3>
                        <p class="text-xs text-emerald-600 font-medium mt-0.5"><i data-lucide="phone" class="w-3 h-3 inline"></i> ${c.phone}</p>
                        <p class="text-xs text-gray-500 mt-0.5"><i data-lucide="map-pin" class="w-3 h-3 inline"></i> ${c.address || 'មិនមានអាសយដ្ឋាន'}</p>
                        ${c.note ? `<p class="text-[10px] text-gray-400 mt-1 italic">ចំណាំ: ${c.note}</p>` : ''}
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="openCustomerModal(${c.id})" class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg"><i data-lucide="edit-2" class="w-4 h-4"></i></button>

        function saveCustomer(e, id) {
            e.preventDefault();
            const name = document.getElementById('cName').value;
            const phone = document.getElementById('cPhone').value;
            const address = document.getElementById('cAddress').value;
            const note = document.getElementById('cNote').value;

            if (id) {
                let idx = appData.customers.findIndex(item => item.id === id);
                if (idx !== -1) appData.customers[idx] = { id, name, phone, address, note };
            } else {
                const newId = appData.customers.length > 0 ? Math.max(...appData.customers.map(c => c.id)) + 1 : 1;
                appData.customers.push({ id: newId, name, phone, address, note });
            }
            saveData();
            closeModal();
            renderContent();
        }

        function deleteCustomer(id) {
            if (confirm("លុបអតិថិជននេះមែនទេ?")) {
                appData.customers = appData.customers.filter(c => c.id !== id);
                saveData();
                renderContent();
            }
        }

        function addSelectedProductToCart(productId) {
            const prod = appData.products.find(p => p.id === productId);
            if (prod) {
                let existing = invoiceCart.find(i => i.id === productId);
                if (existing) {
                    existing.qty += 1;
                } else {
                    invoiceCart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
                }
            }
            closeModal();
            renderContent();
        }

        function removeFromInvoiceCart(index) {
            invoiceCart.splice(index, 1);
            renderContent();

        function finalizeInvoice() {
            if (invoiceCart.length === 0) {
                alert("សូមបញ្ចូលទំនិញក្នុងវិក្កយបត្រជាមុនសិន!");
                return;
            }
            const customer = document.getElementById('invCustomer').value || "អតិថិជនទូទៅ";
            const date = document.getElementById('invDate').value;
            const status = document.querySelector('input[name="payStatus"]:checked').value;
            const total = calculateInvoiceTotal();

            const invNo = `${appData.store.prefix || 'INV'}-${Math.floor(1000 + Math.random() * 9000)}`;
            const newInv = { invNo, customer, date, items: [...invoiceCart], total, currency: invoiceCurrency, status };
            
            appData.invoices.push(newInv);
            if(status === 'paid') {
                appData.finances.push({ id: Date.now(), type: 'income', title: `លក់ទំនិញវិក្កយបត្រ ${invNo}`, amount: total, date });
            }
            saveData();
            
            // Show preview modal with copy & download options
            showInvoicePreviewModal(newInv);
            invoiceCart = [];
        }

            container.innerHTML = `
                <div class="mb-4">
                    <h2 class="text-lg font-bold text-gray-800">គ្រប់គ្រងស្តុកទំនិញ</h2>
                    <p class="text-xs text-gray-500">ទំនិញចូល ចេញ និងរបាយការណ៍ស្តុក</p>
                </div>

                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button onclick="openStockActionModal('in')" class="bg-emerald-600 text-white py-2.5 rounded-xl text-xs font-bold shadow flex items-center justify-center gap-1">
                        <i data-lucide="arrow-down-left" class="w-4 h-4"></i> ទំនិញចូលស្តុក
                    </button>
                    <button onclick="openStockActionModal('out')" class="bg-amber-600 text-white py-2.5 rounded-xl text-xs font-bold shadow flex items-center justify-center gap-1">
                        <i data-lucide="arrow-up-right" class="w-4 h-4"></i> ទំនិញចេញស្តុក
                    </button>
                </div>

                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-4">
                    <h3 class="font-bold text-xs text-gray-700 mb-3">របាយការណ៍ស្តុកសរុប</h3>
                    <div class="space-y-2">
                        ${appData.products.map(p => `
                            <div class="flex justify-between items-center text-xs border-b border-gray-100 pb-2">
                                <div>
                                    <p class="font-bold text-gray-800">${p.name}</p>
                                    <p class="text-gray-400 text-[10px]">កូដ: ${p.code}</p>
                                </div>
                                <span class="bg-gray-100 px-2.5 py-1 rounded-full font-bold text-gray-700">ស្តុក: ${p.qty}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function openStockActionModal(type) {
            const modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl w-full max-w-md p-5">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-gray-800 text-base">${type === 'in' ? 'បន្ថែមទំនិញចូលស្តុក' : 'កត់ត្រាទំនិញចេញស្តុក'}</h3>
                            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="saveStockAction(event, '${type}')" class="space-y-3 text-sm">
                            <div>
                                <label class="block text-xs text-gray-600 mb-1 font-medium">ជ្រើសរើសទំនិញ</label>
                                <select id="stockProdId" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500 bg-white">
                                    ${appData.products.map(p => `<option value="${p.id}">${p.name} (បច្ចុប្បន្ន: ${p.qty})</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-600 mb-1 font-medium">ចំនួនបន្ថែម *</label>
                                <input type="number" id="stockQty" min="1" value="1" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500">
                            </div>
                            <div class="pt-2">
                                <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-bold hover:bg-emerald-700 shadow">កត់ត្រា</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function saveStockAction(e, type) {
            e.preventDefault();
            const prodId = parseInt(document.getElementById('stockProdId').value);
            const qty = parseInt(document.getElementById('stockQty').value) || 0;

            let prod = appData.products.find(p => p.id === prodId);
            if (prod) {
                if (type === 'in') prod.qty += qty;
                else prod.qty = Math.max(0, prod.qty - qty);
                saveData();
                closeModal();
                renderContent();
            }
        }

        // --- 6. SETTINGS TAB ---
        function renderSettingsTab(container) {
            container.innerHTML = `
                <div class="mb-4">
                    <h2 class="text-lg font-bold text-gray-800">ការកំណត់ប្រព័ន្ធ</h2>
                    <p class="text-xs text-gray-500">កំណត់ព័ត៌មានហាង និងគណនី</p>
                </div>

                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3 text-sm">
                    <h3 class="font-bold text-xs text-emerald-700 border-b pb-1">ការកំណត់អាជីវកម្ម</h3>
                    <form onsubmit="saveSettings(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs text-gray-600 mb-1 font-medium">ឈ្មោះហាង</label>
                            <input type="text" id="sName" value="${appData.store.name}" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-1 font-medium">លេខទំនាក់ទំនង</label>
                            <input type="text" id="sPhone" value="${appData.store.phone}" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-1 font-medium">អាសយដ្ឋាន</label>
                            <input type="text" id="sAddress" value="${appData.store.address}" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-1 font-medium">បុ័ក្កលេខវិក្កយបត្រ (Prefix)</label>
                            <input type="text" id="sPrefix" value="${appData.store.prefix || 'INV'}" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-emerald-500">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-bold hover:bg-emerald-700 shadow mt-2">រក្សាទុកការកំណត់</button>
                    </form>
                </div>
            `;
            lucide.createIcons();
        }

        function saveSettings(e) {
            e.preventDefault();
            appData.store.name = document.getElementById('sName').value;
            appData.store.phone = document.getElementById('sPhone').value;
            appData.store.address = document.getElementById('sAddress').value;
            appData.store.prefix = document.getElementById('sPrefix').value;
            saveData();
            alert("រក្សាទុកការកំណត់បានជោគជ័យ!");
            renderContent();
        }

        // Initialize App on Load
        renderContent();
    </script>
</body>
</html>
