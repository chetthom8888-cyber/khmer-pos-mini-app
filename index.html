<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហាងលក់ទំនិញខេមរៈ (Khmer Mini POS - Web Edition)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Kantumruy+Pro:wght@300;400;500;600;700&family=Moul&display=swap" rel="stylesheet">
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Html5-Qrcode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Kantumruy Pro', 'Battambang', sans-serif;
            background-color: #111827;
            color: #f3f4f6;
            -webkit-user-select: text;
            user-select: text;
        }
        .font-moul {
            font-family: 'Moul', cursive, sans-serif;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #1f2937;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            padding-bottom: 90px;
        }
        input, select, textarea {
            background-color: #374151 !important;
            color: #ffffff !important;
            border-color: #4b5563 !important;
        }
        input::placeholder, textarea::placeholder {
            color: #9ca3af !important;
        }
    </style>
</head>
<body class="text-gray-100">

    <!-- Auth / Login Wrapper -->
    <div id="authWrapper" class="app-container flex flex-col items-center justify-center p-6 space-y-4">
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl w-full max-w-sm text-center space-y-4 shadow-xl">
            <div class="bg-emerald-600 text-white w-12 h-12 rounded-full flex items-center justify-center mx-auto font-bold text-xl">POS</div>
            <h1 class="font-bold text-base text-gray-100">Khmer Mini POS Login</h1>
            <p class="text-xs text-gray-400">ចូលដោយប្រើប្រាស់ Code ID របស់អ្នក ដើម្បីទាញយកទិន្នន័យលើឧបករណ៍ផ្សេង។</p>
            
            <div class="space-y-2 text-left text-xs">
                <label class="block text-gray-300 font-medium">បញ្ចូល Code ID របស់អ្នក៖</label>
                <input type="text" id="loginCodeInput" placeholder="ឧ. POS-987654 ឬ Telegram ID" class="w-full p-2.5 border rounded-lg text-center font-bold tracking-widest text-emerald-400 text-sm">
            </div>

            <button onclick="loginWithCustomCode()" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-bold shadow text-xs">ចូលប្រើប្រាស់ប្រព័ន្ធ</button>
        </div>
    </div>

    <!-- Main App Wrapper -->
    <div id="appWrapper" class="app-container flex flex-col justify-between hidden">
        <!-- Header -->
        <header class="bg-emerald-800 text-white p-4 sticky top-0 z-40 shadow-md">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="bg-white text-emerald-800 font-bold px-2 py-1 rounded text-sm">POS</div>
                    <div>
                        <h1 id="headerStoreName" class="font-moul text-sm leading-tight">ហាងលក់ទំនិញខេមរៈ</h1>
                        <p id="headerCurrentDate" class="text-xs text-emerald-200 flex items-center gap-1 mt-0.5"></p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="switchTab('settings')" class="p-1.5 hover:bg-emerald-700 rounded-full">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Viewport -->
        <main id="mainContent" class="p-4 flex-1 overflow-y-auto">
            <!-- Dynamic Content -->
        </main>

        <!-- Fixed Bottom Navigation -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-gray-900 border-t border-gray-800 z-50 shadow-lg">
            <div class="grid grid-cols-6 py-2 text-center text-xs">
                <button onclick="switchTab('products')" id="nav-products" class="flex flex-col items-center justify-center text-emerald-400 font-bold">
                    <i data-lucide="box" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ទំនិញ</span>
                </button>
                <button onclick="switchTab('customers')" id="nav-customers" class="flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400">
                    <i data-lucide="users" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">អតិថិជន</span>
                </button>
                <button onclick="switchTab('invoices')" id="nav-invoices" class="flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400">
                    <i data-lucide="receipt" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">វិក្កយបត្រ</span>
                </button>
                <button onclick="switchTab('finance')" id="nav-finance" class="flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400">
                    <i data-lucide="wallet" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ចំណូល/ចំណាយ</span>
                </button>
                <button onclick="switchTab('stock')" id="nav-stock" class="flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400">
                    <i data-lucide="layers" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">ស្តុកទំនិញ</span>
                </button>
                <button onclick="switchTab('about')" id="nav-about" class="flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400">
                    <i data-lucide="info" class="w-5 h-5 mb-1"></i>
                    <span class="text-[10px]">អំពីយើង</span>
                </button>
            </div>
            <div class="bg-gray-950 text-center py-1 text-[10px] text-gray-500 border-t border-gray-800 select-all">
                Khmer Mini POS Web Edition (Telegram Sync)
            </div>
        </nav>
    </div>

    <!-- Modals Container -->
    <div id="modalContainer"></div>

    <!-- Application Script -->
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); }

        let currentStoreCode = localStorage.getItem('khmer_pos_active_code') || null;
        let currentUserUsername = localStorage.getItem('khmer_pos_username') || null;
        
        let appData = {
            store: { name: "ហាងលក់ទំនិញខេមរៈ", phone: "+855 96 444 4679", address: "ផ្ទះលេខ ១២៣, រាជធានីភ្នំពេញ", prefix: "INV" },
            products: [
                { id: 1, name: "កូកាកូឡា (Coca Cola)", category: "ភេសជ្ជៈ", brand: "CocaCola", cost: 0.50, price: 0.75, qty: 120, code: "PRD-001", desc: "កំប៉ុង" },
                { id: 2, name: "កាហ្វេទឹកដោះគោ", category: "ភេសជ្ជៈ", brand: "Cafe", cost: 1.00, price: 1.50, qty: 50, code: "PRD-002", desc: "ដប" }
            ],
            categories: ["ភេសជ្ជៈ", "ចំណីអាហារ", "សម្ភារប្រើប្រាស់"],
            customers: [{ id: 1, name: "លោក សុខ ជា", phone: "011 222 333", address: "តាខ្មៅ", note: "" }],
            invoices: [],
            finances: [],
            aboutInfo: {
                title: "ហាងលក់ទំនិញខេមរៈ - ស្វាគមន៍វត្តមានលោកអ្នក",
                desc: "យើងខ្ញុំផ្តល់ជូននូវទំនិញដែលមានគុណភាពខ្ពស់ និងតម្លៃសមរម្យ។ គ្រប់គ្រងទំនិញ និងវិក្កយបត្រយ៉ាងងាយស្រួលតាមរយៈ Mini App។",
                date: "2026-07-15"
            },
            installDate: null
        };

        const ADMIN_USERNAME = "@SameanMom168";
        const GLOBAL_ABOUT_KEY = "khmer_pos_global_about_info";

        function initApp() {
            let tgUser = tg?.initDataUnsafe?.user;
            if (tgUser && tgUser.username) {
                currentUserUsername = `@${tgUser.username}`;
                localStorage.setItem('khmer_pos_username', currentUserUsername);
            } else if (!currentUserUsername) {
                currentUserUsername = "guest_user";
            }

            if (!currentStoreCode) {
                if (tgUser && tgUser.id) {
                    currentStoreCode = `TG-${tgUser.id}`;
                } else {
                    currentStoreCode = `POS-${Math.floor(100000 + Math.random() * 900000)}`;
                }
                localStorage.setItem('khmer_pos_active_code', currentStoreCode);
            }

            // Sync Global About Info
            let globalAbout = localStorage.getItem(GLOBAL_ABOUT_KEY);
            if (globalAbout) {
                try { appData.aboutInfo = JSON.parse(globalAbout); } catch(e){}
            } else {
                localStorage.setItem(GLOBAL_ABOUT_KEY, JSON.stringify(appData.aboutInfo));
            }

            let savedData = localStorage.getItem(`khmer_pos_data_${currentStoreCode}`);
            if (savedData) {
                try { 
                    appData = JSON.parse(savedData); 
                    let ga = localStorage.getItem(GLOBAL_ABOUT_KEY);
                    if(ga) appData.aboutInfo = JSON.parse(ga);

                    if (!appData.installDate) {
                        appData.installDate = new Date().toISOString();
                        saveData();
                    }
                } catch(e) {}
            } else {
                appData.installDate = new Date().toISOString();
                saveData();
            }

            updateHeaderDate();
            document.getElementById('authWrapper').classList.add('hidden');
            document.getElementById('appWrapper').classList.remove('hidden');
            renderContent();
            
            // Real-time listener for About Info updates from Admin Panel
            window.addEventListener('storage', (event) => {
                if (event.key === GLOBAL_ABOUT_KEY) {
                    try {
                        let newAbout = JSON.parse(event.newValue);
                        appData.aboutInfo = newAbout;
                        triggerAutoPopupAbout(newAbout);
                    } catch(e){}
                }
            });
        }

        function loginWithCustomCode() {
            let inputCode = document.getElementById('loginCodeInput').value.trim();
            if (!inputCode) { alert("សូមបញ្ចូល Code ID ជាមុនសិន!"); return; }
            currentStoreCode = inputCode;
            localStorage.setItem('khmer_pos_active_code', currentStoreCode);
            
            let savedData = localStorage.getItem(`khmer_pos_data_${currentStoreCode}`);
            if (savedData) {
                try { 
                    appData = JSON.parse(savedData); 
                    let ga = localStorage.getItem(GLOBAL_ABOUT_KEY);
                    if(ga) appData.aboutInfo = JSON.parse(ga);
                } catch(e) {}
            } else {
                appData.installDate = new Date().toISOString();
                saveData();
            }
            document.getElementById('authWrapper').classList.add('hidden');
            document.getElementById('appWrapper').classList.remove('hidden');
            renderContent();
        }

        function saveData() {
            localStorage.setItem(`khmer_pos_data_${currentStoreCode}`, JSON.stringify(appData));
            let headerNameEl = document.getElementById('headerStoreName');
            if(headerNameEl) headerNameEl.innerText = appData.store.name;
        }

        function getKhmerDate(dateInput = new Date()) {
            let d = new Date(dateInput);
            let daysKh = ["អាទិត្យ", "ច័ន្ទ", "អង្គារ", "ពុធ", "ព្រហស្បតិ៍", "សុក្រ", "សៅរ៍"];
            let monthsKh = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
            return `ថ្ងៃ${daysKh[d.getDay()]}, ទី${d.getDate()} ខែ${monthsKh[d.getMonth()]} ឆ្នាំ${d.getFullYear()}`;
        }

        function updateHeaderDate() {
            let el = document.getElementById('headerCurrentDate');
            if (el) el.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-400 inline-block"></span> ${getKhmerDate()}`;
        }

        let currentTab = 'products';
        let activeCategory = 'ទាំងអស់';
        let invoiceCart = [];
        let globalCurrency = '$'; 
        let exchangeRate = 4000;

        function formatMoney(amountInUSD) {
            if (globalCurrency === '៛') {
                return (amountInUSD * exchangeRate).toLocaleString() + ' ៛';
            }
            return '$' + amountInUSD.toFixed(2);
        }

        function switchTab(tab) {
            currentTab = tab;
            ['products', 'customers', 'invoices', 'finance', 'stock', 'about', 'settings'].forEach(t => {
                let btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    btn.className = t === tab 
                        ? "flex flex-col items-center justify-center text-emerald-400 font-bold" 
                        : "flex flex-col items-center justify-center text-gray-400 hover:text-emerald-400";
                }
            });
            renderContent();
        }

        function renderContent() {
            updateHeaderDate();
            let main = document.getElementById('mainContent');
            if (currentTab === 'products') renderProductsTab(main);
            else if (currentTab === 'customers') renderCustomersTab(main);
            else if (currentTab === 'invoices') renderInvoicesTab(main);
            else if (currentTab === 'finance') renderFinanceTab(main);
            else if (currentTab === 'stock') renderStockTab(main);
            else if (currentTab === 'about') renderAboutTab(main);
            else if (currentTab === 'settings') renderSettingsTab(main);
            lucide.createIcons();
        }

        // --- 1. PRODUCTS TAB ---
        function renderProductsTab(container) {
            container.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base font-bold text-gray-100">គ្រប់គ្រងទំនិញ</h2>
                    <button onclick="openProductModal()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1 shadow">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> បញ្ចូលទំនិញ
                    </button>
                </div>
                <div class="flex gap-2 mb-3">
                    <div class="relative flex-1">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-gray-400"></i>
                        <input type="text" id="productSearch" oninput="filterProducts()" placeholder="ស្វែងរកឈ្មោះ ឬ លេខកូដ..." class="w-full pl-9 pr-3 py-2 border rounded-lg text-xs focus:outline-none focus:border-emerald-500">
                    </div>
                    <button onclick="openBarcodeScanner('product')" class="bg-gray-700 text-white px-3 py-2 rounded-lg text-xs flex items-center gap-1 shadow">
                        <i data-lucide="camera" class="w-4 h-4"></i> ស្កេន
                    </button>
                </div>
                <div class="mb-3">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-[11px] font-bold text-gray-400">ប្រភេទទំនិញ:</span>
                        <div class="flex gap-2">
                            <button onclick="openCategoryManagerModal()" class="text-[11px] text-amber-400 font-bold flex items-center gap-0.5"><i data-lucide="settings" class="w-3 h-3"></i> កែប្រែប្រភេទ</button>
                            <button onclick="addCategoryPrompt()" class="text-[11px] text-emerald-400 font-bold flex items-center gap-0.5"><i data-lucide="plus" class="w-3 h-3"></i> បន្ថែម</button>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 overflow-x-auto pb-1">
                        <button onclick="setCategory('ទាំងអស់')" class="px-2.5 py-1 rounded-full text-xs shrink-0 ${activeCategory === 'ទាំងអស់' ? 'bg-emerald-600 text-white font-bold' : 'bg-gray-800 text-gray-300 border border-gray-700'}">ទាំងអស់</button>
                        ${appData.categories.map(cat => `
                            <button onclick="setCategory('${cat}')" class="px-2.5 py-1 rounded-full text-xs shrink-0 ${activeCategory === cat ? 'bg-emerald-600 text-white font-bold' : 'bg-gray-800 text-gray-300 border border-gray-700'}">
                                ${cat}
                            </button>
                        `).join('')}
                    </div>
                </div>
                <div id="productListContainer" class="space-y-2.5">${renderProductItems()}</div>
            `;
            lucide.createIcons();
        }

        function renderProductItems(query = '') {
            let filtered = appData.products.filter(p => {
                let matchCat = activeCategory === 'ទាំងអស់' || p.category === activeCategory;
                let matchQ = p.name.toLowerCase().includes(query.toLowerCase()) || p.code.toLowerCase().includes(query.toLowerCase());
                return matchCat && matchQ;
            });
            if (filtered.length === 0) return `<div class="text-center py-6 text-gray-500 text-xs">រកមិនឃើញទំនិញ</div>`;
            return filtered.map(p => `
                <div class="bg-gray-800 p-3 rounded-xl border border-gray-700 shadow-sm flex justify-between items-center text-xs">
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h3 class="font-bold text-gray-100">${p.name}</h3>
                            <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-[10px] px-1.5 py-0.5 rounded">${p.category}</span>
                        </div>
                        <p class="text-gray-400 mt-0.5">កូដ: ${p.code} | ស្តុក: <span class="font-bold text-gray-200">${p.qty}</span></p>
                        <p class="text-emerald-400 font-bold mt-0.5">តម្លៃលក់: ${formatMoney(p.price)}</p>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="openProductModal(${p.id})" class="p-1.5 text-gray-300 hover:bg-gray-700 rounded"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        <button onclick="deleteProduct(${p.id})" class="p-1.5 text-red-400 hover:bg-red-950 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            let q = document.getElementById('productSearch').value;
            document.getElementById('productListContainer').innerHTML = renderProductItems(q);
            lucide.createIcons();
        }

        function setCategory(cat) { activeCategory = cat; renderContent(); }

        function addCategoryPrompt() {
            let name = prompt("បញ្ចូលឈ្មោះប្រភេទទំនិញថ្មី៖");
            if (name && name.trim()) {
                if (!appData.categories.includes(name.trim())) {
                    appData.categories.push(name.trim());
                    saveData();
                    renderContent();
                } else alert("មានរួចហើយ!");
            }
        }

        function openCategoryManagerModal() {
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
                    <div class="bg-gray-900 text-white rounded-2xl w-full max-w-sm p-4 text-xs max-h-[80vh] overflow-y-auto border border-gray-800 space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-sm">គ្រប់គ្រងប្រភេទទំនិញ</h3>
                            <button onclick="closeModal(); renderContent();" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="space-y-2">
                            ${appData.categories.map((cat, idx) => `
                                <div class="flex items-center justify-between bg-gray-800 p-2 rounded border border-gray-700">
                                    <input type="text" id="catInput_${idx}" value="${cat}" class="w-3/5 p-1 border rounded text-xs">
                                    <div class="flex gap-1">
                                        <button onclick="updateCategoryItem(${idx})" class="bg-emerald-600 text-white px-2 py-1 rounded font-bold">កែ</button>
                                        <button onclick="deleteCategoryItem(${idx})" class="bg-red-600 text-white px-2 py-1 rounded font-bold">លុប</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function updateCategoryItem(idx) {
            let newVal = document.getElementById(`catInput_${idx}`).value.trim();
            if (newVal) {
                let oldVal = appData.categories[idx];
                appData.categories[idx] = newVal;
                appData.products.forEach(p => { if(p.category === oldVal) p.category = newVal; });
                saveData();
                alert("កែប្រែបានជោគជ័យ!");
                openCategoryManagerModal();
            }
        }

        function deleteCategoryItem(idx) {
            if (confirm("តើអ្នកចង់លុបប្រភេទទំនិញនេះមែនទេ?")) {
                let removed = appData.categories.splice(idx, 1)[0];
                appData.products.forEach(p => { if(p.category === removed) p.category = 'ផ្សេងៗ'; });
                saveData();
                openCategoryManagerModal();
            }
        }

        function openProductModal(id = null) {
            let p = id ? appData.products.find(item => item.id === id) : { name: '', category: appData.categories[0] || 'ផ្សេងៗ', brand: '', cost: 0, price: 0, qty: 1, code: 'PRD-' + Math.floor(1000 + Math.random() * 9000) };
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">

        function saveProduct(e, id) {
            e.preventDefault();
            let name = document.getElementById('pName').value;
            let category = document.getElementById('pCat').value;
            let brand = document.getElementById('pBrand').value;
            let cost = parseFloat(document.getElementById('pCost').value) || 0;
            let price = parseFloat(document.getElementById('pPrice').value) || 0;
            let qty = parseInt(document.getElementById('pQty').value) || 0;
            let code = document.getElementById('pCode').value;

            if (id) {
                let idx = appData.products.findIndex(p => p.id === id);
                if (idx !== -1) appData.products[idx] = { id, name, category, brand, cost, price, qty, code };
            } else {
                let newId = appData.products.length ? Math.max(...appData.products.map(p => p.id)) + 1 : 1;
                appData.products.push({ id: newId, name, category, brand, cost, price, qty, code });
            }
            saveData();
            closeModal();
            renderContent();
        }

        function openBarcodeScanner(targetContext) {
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center p-4">
                    <div class="bg-gray-900 text-white rounded-2xl w-full max-w-md p-4 text-xs border border-gray-800">

                        </div>
                        <div id="reader" class="w-full overflow-hidden rounded-lg"></div>
                    </div>
                </div>
            `;
            lucide.createIcons();
            setTimeout(() => {
                const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 150 } }, false);
                scanner.render((decodedText) => {
                    scanner.clear().catch(e => console.error(e));
                    closeModal();
                    if (targetContext === 'product') {
                        let searchInput = document.getElementById('productSearch');
                        if (searchInput) { searchInput.value = decodedText; filterProducts(); }
                    } else if (targetContext === 'invoice') {
                        let prod = appData.products.find(p => p.code === decodedText || p.name.includes(decodedText));
                        if (prod) addCartItem(prod.id);
                        else alert("រកមិនឃើញទំនិញដែលមានកូដ: " + decodedText);
                    }
                }, (error) => {});
                window.activeScanner = scanner;
            }, 300);
        }

            if (window.activeScanner) window.activeScanner.clear().catch(e => {});
            closeModal();

        function addCartItem(productId) {
            let prod = appData.products.find(p => p.id === productId);
            if (prod) {
                let exist = invoiceCart.find(i => i.id === productId);
                if (exist) exist.qty += 1;
                else invoiceCart.push({ id: prod.id, name: prod.name, brand: prod.brand || '', code: prod.code, price: prod.price, qty: 1 });
            }
            renderContent();
        }

        function updateCartQty(id, qty) {
            let item = invoiceCart.find(i => i.id === id);
            if (item) item.qty = Math.max(1, parseInt(qty) || 1);
            renderContent();
        }

        function updateCartPrice(id, price) {
            let item = invoiceCart.find(i => i.id === id);
            if (item) item.price = Math.max(0, parseFloat(price) || 0);
            renderContent();
        }

        function removeFromCart(id) {
            invoiceCart = invoiceCart.filter(i => i.id !== id);
            renderContent();
        }

        function calculateCartTotal() {
            return invoiceCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
        }

        function finalizeInvoice() {
            if (invoiceCart.length === 0) { alert("សូមបញ្ចូលទំនិញក្នុងវិក្កយបត្រជាមុនសិន!"); return; }

            for(let item of invoiceCart) {
                let p = appData.products.find(prod => prod.id === item.id);
                if(p && p.qty < item.qty) {
                    alert(`ទំនិញ "${p.name}" ស្តុកនៅសល់ត្រឹមតែ ${p.qty} ប៉ុណ្ណោះ!`);
                    return;
                }
            }

            let customer = document.getElementById('invCustomer').value;
            let date = document.getElementById('invDate').value;
            let status = document.querySelector('input[name="payStatus"]:checked').value;
            let totalUSD = calculateCartTotal();
            let invNo = `${appData.store.prefix}-${Math.floor(1000 + Math.random() * 9000)}`;

            invoiceCart.forEach(item => {
                let p = appData.products.find(prod => prod.id === item.id);
                if (p) p.qty -= item.qty;
            });

            let newInv = { invNo, customer, date, items: [...invoiceCart], totalUSD, currency: globalCurrency, status };
            appData.invoices.push(newInv);
            
            if(status === 'paid') {
                appData.finances.push({ id: Date.now(), type: 'income', title: `លក់ទំនិញ (${invNo}) - ${customer}`, amountUSD: totalUSD, date });
            }
            saveData();
            showExactReceiptPreview(newInv);
            invoiceCart = [];
        }

            let todayStr = new Date().toISOString().split('T')[0];
            let currentMonthStr = todayStr.substring(0, 7); // YYYY-MM

            let dailyInc = appData.finances.filter(f => f.date === todayStr && f.type === 'income').reduce((s, f) => s + f.amountUSD, 0);
            let dailyExp = appData.finances.filter(f => f.date === todayStr && f.type === 'expense').reduce((s, f) => s + f.amountUSD, 0);
            
            let monthlyInc = appData.finances.filter(f => f.date.startsWith(currentMonthStr) && f.type === 'income').reduce((s, f) => s + f.amountUSD, 0);
            let monthlyExp = appData.finances.filter(f => f.date.startsWith(currentMonthStr) && f.type === 'expense').reduce((s, f) => s + f.amountUSD, 0);

            container.innerHTML = `
                <div class="mb-3 flex justify-between items-center">
                    <h2 class="text-base font-bold text-gray-100">ចំណូល និង ចំណាយ</h2>
                    <div class="flex gap-1.5">
                        <button onclick="openFinanceModal('income')" class="bg-emerald-600 text-white px-2 py-1.5 rounded text-xs font-bold flex items-center gap-1 shadow">
                            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> ចំណូល
                        </button>
                        <button onclick="openFinanceModal('expense')" class="bg-red-600 text-white px-2 py-1.5 rounded text-xs font-bold flex items-center gap-1 shadow">
                            <i data-lucide="minus-circle" class="w-3.5 h-3.5"></i> ចំណាយ
                        </button>
                    </div>
                </div>

                <!-- របាយការណ៍ប្រចាំថ្ងៃ និងប្រចាំខែ -->
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <div class="bg-gray-800 border border-emerald-700/60 p-2.5 rounded-xl text-xs space-y-1">
                        <p class="text-emerald-400 font-bold border-b border-gray-700 pb-1">📅 ប្រចាំថ្ងៃ (ថ្ងៃនេះ)</p>
                        <p class="text-gray-300">ចំណូល: <b class="text-emerald-400">${formatMoney(dailyInc)}</b></p>
                        <p class="text-gray-300">ចំណាយ: <b class="text-red-400">${formatMoney(dailyExp)}</b></p>
                    </div>
                    <div class="bg-gray-800 border border-blue-700/60 p-2.5 rounded-xl text-xs space-y-1">
                        <p class="text-blue-400 font-bold border-b border-gray-700 pb-1">📊 ប្រចាំខែ (ខែនេះ)</p>
                        <p class="text-gray-300">ចំណូល: <b class="text-emerald-400">${formatMoney(monthlyInc)}</b></p>
                        <p class="text-gray-300">ចំណាយ: <b class="text-red-400">${formatMoney(monthlyExp)}</b></p>
                    </div>
                </div>

                <div class="space-y-2 text-xs">
                    <h3 class="font-bold text-gray-300 mb-1">ប្រតិបត្តិការទាំងអស់៖</h3>
                    ${appData.finances.length === 0 ? `<div class="text-center py-6 text-gray-500 text-xs">មិនទាន់មានទិន្នន័យចំណូលចំណាយ</div>` : 
                        appData.finances.map(f => `
                        <div class="bg-gray-800 p-2.5 rounded border border-gray-700 shadow-sm flex justify-between items-center">
                            <div>
                                <p class="font-bold text-gray-100 flex items-center gap-1">
                                    <span class="w-2 h-2 rounded-full ${f.type === 'income' ? 'bg-emerald-400' : 'bg-red-400'}"></span>
                                    ${f.title}
                                </p>
                                <p class="text-gray-400 text-[10px] mt-0.5">${getKhmerDate(f.date)}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold ${f.type === 'income' ? 'text-emerald-400' : 'text-red-400'}">
                                    ${f.type === 'income' ? '+' : '-'}${formatMoney(f.amountUSD)}
                                </span>
                                <button onclick="deleteFinance(${f.id})" class="text-red-400 p-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            lucide.createIcons();
        }

        function openFinanceModal(type) {
            let titleText = type === 'income' ? 'បន្ថែមចំណូលថ្មី' : 'បន្ថែមចំណាយថ្មី';
            let colorTheme = type === 'income' ? 'bg-emerald-600' : 'bg-red-600';
            let today = new Date().toISOString().split('T')[0];

            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
                    <div class="bg-gray-900 text-white rounded-2xl w-full max-w-sm p-4 text-xs border border-gray-800">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-sm">${titleText}</h3>
                            <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="saveFinance(event, '${type}')" class="space-y-2.5">
                            <div>
                                <label class="block mb-1 text-gray-300">ចំណូល/ចំណាយលើអ្វី *</label>
                                <input type="text" id="fTitle" placeholder="ឧ. លក់ទំនិញដុំ, ទិញសម្ភារៈ..." required class="w-full p-2 border rounded">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block mb-1 text-gray-300">ទឹកប្រាក់ ($ USD)</label>
                                    <input type="number" step="0.01" id="fAmountUSD" placeholder="0.00" oninput="document.getElementById('fAmountKHR').value = (this.value * ${exchangeRate}) || 0;" class="w-full p-2 border rounded">
                                </div>
                                <div>
                                    <label class="block mb-1 text-gray-300">ទឹកប្រាក់ (៛ រៀល)</label>
                                    <input type="number" id="fAmountKHR" placeholder="0" oninput="document.getElementById('fAmountUSD').value = (this.value / ${exchangeRate}).toFixed(2) || 0;" class="w-full p-2 border rounded">
                                </div>
                            </div>
                            <div>
                                <label class="block mb-1 text-gray-300">កាលបរិច្ឆេទ</label>
                                <input type="date" id="fDate" value="${today}" class="w-full p-2 border rounded">
                            </div>
                            <button type="submit" class="w-full ${colorTheme} text-white py-2 rounded font-bold shadow mt-2">រក្សាទុក</button>
                        </form>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function saveFinance(e, type) {
            e.preventDefault();
            let title = document.getElementById('fTitle').value;
            let amountUSD = parseFloat(document.getElementById('fAmountUSD').value) || 0;
            let date = document.getElementById('fDate').value;

            if (amountUSD <= 0) { alert("សូមបញ្ចូលចំនួនទឹកប្រាក់ឱ្យបានត្រឹមត្រូវ!"); return; }

            appData.finances.unshift({ id: Date.now(), type, title, amountUSD, date });
            saveData();
            closeModal();
            renderContent();
        }

        function deleteFinance(id) {
            appData.finances = appData.finances.filter(f => f.id !== id);
            saveData();
            renderContent();
        }

        // --- 5. STOCK TAB ---
        function renderStockTab(container) {
            container.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-base font-bold text-gray-100">ស្តុកទំនិញ និងរបាយការណ៍</h2>
                    <button onclick="openMonthlyStockReport()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs flex items-center gap-1 shadow">
                        <i data-lucide="file-text" class="w-3.5 h-3.5"></i> របាយការណ៍ស្តុកខែនេះ
                    </button>
                </div>
                <div class="space-y-2 text-xs">
                    ${appData.products.map(p => `
                        <div class="bg-gray-800 p-2.5 rounded border border-gray-700 shadow-sm flex justify-between items-center">
                            <div><p class="font-bold text-gray-100">${p.name}</p><p class="text-gray-400">កូដ: ${p.code}</p></div>
                            <span class="bg-gray-700 text-gray-200 px-2 py-1 rounded font-bold">ស្តុក: ${p.qty}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            lucide.createIcons();
        }

        function openMonthlyStockReport() {
            let totalProducts = appData.products.length;
            let totalQty = appData.products.reduce((sum, p) => sum + p.qty, 0);
            let totalValue = appData.products.reduce((sum, p) => sum + (p.price * p.qty), 0);
            let reportDateStr = getKhmerDate();

            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-3">
                    <div class="bg-gray-900 text-white rounded-2xl w-full max-w-md p-4 text-xs max-h-[95vh] overflow-y-auto border border-gray-800">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-sm text-emerald-400">របាយការណ៍ស្តុកប្រចាំខែ</h3>
                            <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="bg-white text-gray-900 p-3 rounded-lg space-y-2 select-all font-mono text-[11px]">
                            <p style="font-family: 'Moul', cursive;" class="font-bold text-center text-blue-900 text-xs">${appData.store.name}</p>
                            <p class="text-center text-gray-600">${reportDateStr}</p>
                            <hr>
                            <p><b>មុខទំនិញសរុប:</b> ${totalProducts}</p>
                            <p><b>ចំនួនស្តុកសរុប:</b> ${totalQty}</p>
                            <p><b>តម្លៃលក់សរុបក្នុងស្តុក:</b> $${totalValue.toFixed(2)}</p>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <button onclick="window.print()" class="w-full col-span-2 bg-gray-700 text-white py-2 rounded font-bold shadow flex items-center justify-center gap-1">
                                <i data-lucide="printer" class="w-4 h-4"></i> បោះពុម្ព
                            </button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // --- 6. ABOUT US / PROMOTIONS TAB (Managed Solely by Admin @SameanMom168) ---
        function renderAboutTab(container) {
            let isAdmin = (currentUserUsername === ADMIN_USERNAME || currentUserUsername === "@SameanMom168");
            let about = appData.aboutInfo;

            container.innerHTML = `
                <div class="mb-3"><h2 class="text-base font-bold text-gray-100">អំពីយើង និងសេចក្តីជូនដំណឹង</h2></div>
                <div class="space-y-3 text-xs">
                    <div class="bg-gray-800 border border-gray-700 p-4 rounded-xl space-y-2 shadow">
                        <h3 class="font-bold text-emerald-400 text-sm">${about.title}</h3>
                        <p class="text-gray-300 leading-relaxed">${about.desc}</p>
                        <p class="text-[10px] text-gray-500 text-right">កាលបរិច្ឆេទធ្វើបច្ចុប្បន្នភាព៖ ${about.date}</p>
                    </div>

                    ${isAdmin ? `
                        <div class="bg-emerald-950/60 border border-emerald-600 p-3 rounded-xl space-y-2">
                            <h3 class="font-bold text-emerald-400 flex items-center gap-1"><i data-lucide="shield-check" class="w-4 h-4"></i> Admin Panel (@SameanMom168)</h3>
                            <p class="text-gray-300 text-[11px]">កែប្រែព័ត៌មាន "អំពីយើង" និងផ្ញើជូនគ្រប់ Telegram App ទាំងអស់ភ្លាមៗស្វ័យប្រវត្ត។</p>
                            
                            <form onsubmit="saveAdminAboutInfo(event)" class="space-y-2 pt-1">
                                <div><label class="block mb-1">ចំណងជើង *</label><input type="text" id="adminAboutTitle" value="${about.title}" required class="w-full p-2 border rounded"></div>
                                <div><label class="block mb-1">ព័ត៌មានលម្អិត *</label><textarea id="adminAboutDesc" rows="3" required class="w-full p-2 border rounded">${about.desc}</textarea></div>
                                <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded font-bold shadow">រក្សាទុក និង Broadcast ភ្លាមៗ</button>
                            </form>
                        </div>
                    ` : `
                        <div class="text-center py-2 text-gray-500 text-[11px]">
                            គ្រប់គ្រងដោយ Admin Panel (${ADMIN_USERNAME}) ម្នាក់គត់។
                        </div>
                    `}
                </div>
            `;
            lucide.createIcons();
        }

        function saveAdminAboutInfo(e) {
            e.preventDefault();
            let title = document.getElementById('adminAboutTitle').value;
            let desc = document.getElementById('adminAboutDesc').value;
            let date = new Date().toISOString().split('T')[0];

            let newAbout = { title, desc, date };
            appData.aboutInfo = newAbout;

            localStorage.setItem(GLOBAL_ABOUT_KEY, JSON.stringify(newAbout));
            saveData();

            alert("បានរក្សាទុក និង Broadcast ទៅកាន់គ្រប់ Telegram App ទាំងអស់ជោគជ័យ!");
            triggerAutoPopupAbout(newAbout);
            renderContent();
        }

        function triggerAutoPopupAbout(about) {
            let modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4">
                    <div class="bg-gray-900 text-white rounded-2xl w-full max-w-md p-5 text-xs border-2 border-emerald-500 space-y-3 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                            <h3 class="font-bold text-sm text-emerald-400 flex items-center gap-1"><i data-lucide="bell" class="w-4 h-4"></i> ព័ត៌មានថ្មីពី Admin!</h3>
                            <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="bg-gray-800 p-3 rounded-xl border border-emerald-600/50 space-y-2">
                            <p class="font-bold text-emerald-300 text-sm">${about.title}</p>
                            <p class="text-gray-200 text-xs leading-relaxed">${about.desc}</p>
                            <p class="text-[10px] text-gray-400 text-right">${about.date}</p>
                        </div>
                        <button onclick="closeModal()" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-bold shadow">យល់ព្រម / បិទ</button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // --- 7. SETTINGS TAB ---
        function renderSettingsTab(container) {
            container.innerHTML = `
                <div class="mb-3"><h2 class="text-base font-bold text-gray-100">ការកំណត់ប្រព័ន្ធ</h2></div>
                <div class="space-y-3 text-xs">
                    <div class="bg-emerald-950/70 border border-emerald-600 p-3 rounded-xl space-y-1.5 shadow">
                        <h3 class="font-bold text-emerald-400 flex items-center gap-1"><i data-lucide="key" class="w-4 h-4"></i> Code ID សម្រាប់ Sync ឧបករណ៍ផ្សេង</h3>
                        <div class="bg-gray-900 p-2 rounded text-center text-emerald-300 font-mono font-bold text-sm tracking-wider select-all border border-emerald-800">
                            ${currentStoreCode}
                        </div>
                        <button onclick="navigator.clipboard.writeText('${currentStoreCode}').then(()=>alert('បានចម្លង Code ID រួចរាល់!'))" class="w-full bg-emerald-700 text-white py-1.5 rounded font-bold mt-1">ចម្លង Code ID</button>
                    </div>

                    <form onsubmit="saveSettings(event)" class="bg-gray-800 p-3 rounded-xl border border-gray-700 shadow-sm space-y-2.5">
                        <h3 class="font-bold text-emerald-400">ព័ត៌មានហាង</h3>
                        <div><label class="block mb-1 text-gray-300">ឈ្មោះហាង</label><input type="text" id="sName" value="${appData.store.name}" required class="w-full p-2 border rounded font-moul"></div>
                        <div><label class="block mb-1 text-gray-300">លេខទូរស័ព្ទហាង</label><input type="text" id="sPhone" value="${appData.store.phone}" required class="w-full p-2 border rounded"></div>
                        <div><label class="block mb-1 text-gray-300">អាសយដ្ឋានហាង</label><input type="text" id="sAddress" value="${appData.store.address || ''}" class="w-full p-2 border rounded"></div>
                        <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded font-bold shadow mt-2">រក្សាទុកព័ត៌មាន</button>
                    </form>

                    <div class="bg-gray-800 border border-gray-700 p-3 rounded-xl space-y-2">
                        <button onclick="logoutApp()" class="w-full bg-red-950 text-red-400 border border-red-800 py-2 rounded font-bold">ออกจากระบบ / ប្តូរគណនី</button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function saveSettings(e) {
            e.preventDefault();
            appData.store.name = document.getElementById('sName').value;
            appData.store.phone = document.getElementById('sPhone').value;
            appData.store.address = document.getElementById('sAddress').value;
            saveData();
            alert("រក្សាទុកបានជោគជ័យ!");
            renderContent();
        }

        function logoutApp() {
            if (confirm("តើអ្នកចង់ចាកចេញពីគណនីនេះមែនទេ?")) {
                localStorage.removeItem('khmer_pos_active_code');
                location.reload();
            }
        }

        function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

        initApp();
    </script>
</body>
</html>
